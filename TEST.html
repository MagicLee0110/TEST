<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a152e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>iOS 通知中心 - 完美全螢幕版</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --card-bg: rgba(40, 40, 40, 0.4);
            --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            --top-color: #1a152e; /* 定義頂部顏色 */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: var(--font-main);
            color: white;
            overflow: hidden;
            /* 確保背景顏色從最頂部開始 */
            background: linear-gradient(180deg, var(--top-color) 0%, #3a2b5e 50%, var(--top-color) 100%);
            background-size: cover;
        }

        /* 時間日期區 - 考量瀏海高度增加 padding-top */
        .clock-container {
            text-align: center;
            padding-top: calc(env(safe-area-inset-top) + 40px);
        }

        .date-text {
            font-size: 19px;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .time-text {
            font-size: 95px;
            font-weight: 200;
            margin: 0;
            letter-spacing: -2px;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 25px 15px;
        }

        .notification-header h2 {
            font-size: 28px;
            margin: 0;
            font-weight: 600;
        }

        .close-btn {
            width: 28px; height: 28px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center; justify-content: center; font-size: 14px;
        }

        .notification-list {
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notif-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .notif-top { display: flex; gap: 12px; }

        .notif-icon {
            width: 38px; height: 38px;
            border-radius: 8px;
            position: relative;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }

        .notif-badge {
            position: absolute;
            top: -5px; right: -5px;
            background: white; color: black;
            font-size: 10px; font-weight: bold;
            padding: 2px 4px; border-radius: 10px;
        }

        .notif-title-row {
            display: flex; justify-content: space-between;
            font-size: 15px; font-weight: 600; margin-bottom: 2px;
        }

        .notif-time { font-weight: 400; opacity: 0.6; font-size: 13px; }

        .notif-body { font-size: 14px; line-height: 1.4; opacity: 0.9; }

        /* 底部 Home Bar */
        .home-bar {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom) + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 140px; height: 5px;
            background: white; border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <div class="date-text" id="dateDisplay">1月3日 週六</div>
        <h1 class="time-text" id="timeDisplay">00:00</h1>
    </div>

    <div class="notification-header">
        <h2>通知中心</h2>
        <div class="close-btn">✕</div>
    </div>

    <div class="notification-list">
        <div class="notif-card">
            <div class="notif-top">
                <div class="notif-icon" style="background-color: #ff4500;">S<span class="notif-badge">23</span></div>
                <div class="notif-content" style="flex:1;">
                    <div class="notif-title-row">
                        <span>您關注的賣家開始直播了！</span>
                        <span class="notif-time">1小時前</span>
                    </div>
                    <div class="notif-body">觀看 Yomigirls 的直播：神美浩肯包🤩...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="home-bar"></div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hours}:${minutes}`;

            const month = now.getMonth() + 1;
            const date = now.getDate();
            const weekDays = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
            const dayName = weekDays[now.getDay()];
            document.getElementById('dateDisplay').textContent = `${month}月${date}日 ${dayName} · 乙巳年冬月十五`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
