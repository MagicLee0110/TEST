<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a152e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>iOS Magic Center</title>
    <style>
        :root {
            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            --top-color: #1a152e;
            --main-gradient: linear-gradient(180deg, #1a152e 0%, #3a2b5e 50%, #1a152e 100%);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--top-color);
            background-image: var(--main-gradient);
            background-attachment: fixed;
            overflow: hidden;
            font-family: var(--ios-font);
            color: white;
        }

        /* 通知中心主畫面 */
        #notification-center {
            width: 100%; height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1);
            z-index: 1;
        }

        .clock-container {
            text-align: center;
            padding-top: calc(env(safe-area-inset-top) + 60px);
        }

        .time-text { font-size: 95px; font-weight: 200; margin: 0; letter-spacing: -2px; }
        .date-text { font-size: 19px; opacity: 0.9; }

        .notification-header { padding: 40px 25px 15px; font-size: 28px; font-weight: 600; }

        /* 通知卡片 */
        .notif-card {
            background: rgba(40, 40, 40, 0.4);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; padding: 15px; margin: 0 15px 10px;
            display: flex; gap: 12px;
        }

        /* 隱形六宮格感應區 */
        .magic-grid {
            position: absolute;
            bottom: 60px; /* 避開底部 Home Bar */
            left: 0; width: 100%; height: 40%; /* 佔據下半部 */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            z-index: 10;
        }
        .magic-btn { background: transparent; border: none; outline: none; }

        /* 模擬備忘錄畫面 */
        #memo-screen {
            position: absolute;
            top: 100%; /* 初始位置在畫面外下方 */
            left: 0; width: 100%; height: 100%;
            background: #fff; /* 備忘錄典型的白色底 */
            color: #000;
            z-index: 2;
            transition: transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1);
            display: flex; flex-direction: column;
        }

        /* 備忘錄頂部欄 */
        .memo-header {
            padding: calc(env(safe-area-inset-top) + 10px) 20px 10px;
            display: flex; justify-content: space-between;
            align-items: center; color: #d4a017; /* 備忘錄金黃色 */
            font-size: 17px; border-bottom: 1px solid #eee;
        }

        .handwriting-area {
            flex: 1; padding: 40px 20px;
            /* 使用手寫感字體 */
            font-family: "Cursive", "Segoe Print", "Bradley Hand", "Marker Felt", sans-serif;
            font-size: 80px;
            text-align: center;
            display: flex; justify-content: center; align-items: flex-start;
        }

        /* 上滑動作 */
        .active-memo #notification-center { transform: translateY(-100%); }
        .active-memo #memo-screen { transform: translateY(-100%); }

        .home-bar {
            position: fixed; bottom: 8px; left: 50%;
            transform: translateX(-50%); width: 140px; height: 5px;
            background: white; border-radius: 10px; z-index: 20;
            transition: background 0.3s;
        }
        .active-memo .home-bar { background: #ccc; }
    </style>
</head>
<body id="body">

    <div id="notification-center">
        <div class="clock-container">
            <div class="date-text" id="dateDisplay">1月3日 週六</div>
            <h1 class="time-text" id="timeDisplay">00:00</h1>
        </div>
        <div class="notification-header">通知中心</div>
        <div class="notif-card">
            <div style="width:38px; height:38px; background:#ff4500; border-radius:8px;"></div>
            <div>
                <div style="font-weight:600;">備忘錄</div>
                <div style="font-size:14px; opacity:0.8;">剛剛：這裡有一些重要筆記...</div>
            </div>
        </div>

        <div class="magic-grid">
            <div class="magic-btn" onclick="openMemo(36)"></div>
            <div class="magic-btn" onclick="openMemo(45)"></div>
            <div class="magic-btn" onclick="openMemo(54)"></div>
            <div class="magic-btn" onclick="openMemo(63)"></div>
            <div class="magic-btn" onclick="openMemo(72)"></div>
            <div class="magic-btn" onclick="openMemo(81)"></div>
        </div>
    </div>

    <div id="memo-screen" onclick="closeMemo()">
        <div class="memo-header">
            <span>＜ 備忘錄</span>
            <span style="font-weight:600;">完成</span>
        </div>
        <div class="handwriting-area" id="handwritingNumber">
            </div>
    </div>

    <div class="home-bar"></div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hours}:${minutes}`;
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const weekDays = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
            document.getElementById('dateDisplay').textContent = `${month}月${date}日 ${weekDays[now.getDay()]} · 乙巳年冬月十五`;
        }

        function openMemo(num) {
            document.getElementById('handwritingNumber').textContent = num;
            document.getElementById('body').classList.add('active-memo');
        }

        function closeMemo() {
            document.getElementById('body').classList.remove('active-memo');
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
