<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Canvas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000; /* 黑底，看起來像螢幕關閉或簡約 */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: sans-serif;
            cursor: none;
        }

        /* 完全隱藏輸入框，但保持其功能 */
        #hiddenInput {
            position: absolute;
            top: -100px;
            left: -100px;
            opacity: 0;
            filter: alpha(opacity=0);
        }

        /* 撲克牌顯示區 */
        #display {
            font-size: 150px; /* 超大字體，方便觀眾看清 */
            font-weight: bold;
            transition: all 0.2s ease-in-out;
            user-select: none;
        }

        .red { color: #ff4d4d; }
        .black { color: #ffffff; }
        .none { color: #333; font-size: 24px; } /* 初始狀態 */
    </style>
</head>
<body>

    <input type="text" id="hiddenInput" inputmode="numeric" pattern="[0-9]*" autocomplete="off">

    <div id="display" class="none">READY</div>

    <script>
        const inputEl = document.getElementById('hiddenInput');
        const displayEl = document.getElementById('display');

        const suits = {
            '1': { icon: '♠', color: 'black' },
            '2': { icon: '♥', color: 'red' },
            '3': { icon: '♦', color: 'red' },
            '4': { icon: '♣', color: 'black' }
        };

        const ranks = {
            '01': 'A', '02': '2', '03': '3', '04': '4', '05': '5',
            '06': '6', '07': '7', '08': '8', '09': '9', '10': '10',
            '11': 'J', '12': 'Q', '13': 'K'
        };

        // 核心邏輯：偵測輸入
        inputEl.addEventListener('input', (e) => {
            let val = e.target.value;

            // 每當達到 3 個數字
            if (val.length === 3) {
                const suitKey = val[0];
                const rankKey = val.substring(1, 3);

                const suit = suits[suitKey];
                const rank = ranks[rankKey];

                if (suit && rank) {
                    displayEl.innerHTML = `${suit.icon}${rank}`;
                    displayEl.className = suit.color;
                } else {
                    // 如果輸入錯誤（例如 599），顯示一個小提示或不反應
                    displayEl.innerHTML = '??';
                    displayEl.className = 'none';
                }

                // 重點：立即清空輸入框，等待下一個 3 位數循環
                e.target.value = '';
            }
        });

        // 點擊螢幕任何地方就強制 Focus 到輸入框，確保鍵盤彈出
        document.body.addEventListener('click', () => {
            inputEl.focus();
            if(displayEl.innerHTML === 'READY') {
                displayEl.innerHTML = ''; // 第一次點擊後清空 READY 字樣
            }
        });

        // 防止手機端長按彈出選單
        window.oncontextmenu = function(event) {
            event.preventDefault();
            event.stopPropagation();
            return false;
        };
    </script>
</body>
</html>
