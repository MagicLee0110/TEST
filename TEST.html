<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>備忘錄</title>
    <style>
        :root {
            --ios-gold: #d4a373;
            --ios-bg: #ffffff;
            --ios-divider: #c6c6c8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            margin: 0; padding: 0;
            background-color: var(--ios-bg);
            user-select: none; -webkit-user-select: none;
        }

        /* 數字提示器 - 極淡 */
        #force-indicator {
            position: fixed;
            top: 10px; left: 15px;
            font-size: 14px; font-weight: 600;
            color: rgba(0, 0, 0, 0.05);
            z-index: 10001;
        }

        /* 側邊刻度提示 */
        .edge-hint {
            position: fixed;
            left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10000;
            display: block; /* 預設顯示 */
        }
        .dash { position: absolute; font-size: 10px; color: rgba(0,0,0,0.04); }

        #list-page { display: block; padding-top: 20px; }
        #content-page { display: none; position: relative; padding-top: 20px; }

        .header { padding: 10px 20px; }
        h1 { font-size: 34px; margin: 5px 0; font-weight: 700; color: #000; }
        
        /* 隱藏的切換按鈕：點擊導覽列切換「鎖定/解鎖」滑動 */
        .nav-bar { 
            display: flex; align-items: center; 
            padding: 10px 15px; color: var(--ios-gold); 
            font-size: 17px; position: relative; z-index: 10002;
        }

        .note-item { padding: 12px 20px; border-bottom: 0.5px solid var(--ios-divider); margin-left: 20px; padding-left: 0; }
        .content-area { padding: 0 20px 120px 20px; }
        .animal-line { padding: 12px 0; border-bottom: 0.5px solid #efeff4; font-size: 17px; color: #333; }

        /* 感應區總層 */
        #secret-zones {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; display: flex; flex-direction: column;
            touch-action: none; /* 這裡會擋住捲動 */
        }
        #zero-nine-zone { height: 25%; width: 100%; }
        #grid-zone {
            height: 75%; width: 100%;
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
        }

        /* 當進入展示模式時，隱藏感應層 */
        .show-mode #secret-zones, .show-mode .edge-hint {
            display: none !important;
        }
    </style>
</head>
<body id="main-body">

    <div id="force-indicator"></div>

    <div class="edge-hint" id="hints">
        <div class="dash" style="top: 15%; left: 2px;">- 0</div>
        <div class="dash" style="top: 30%; left: 2px;">- 10</div>
        <div class="dash" style="top: 30%; right: 2px;">- 30</div>
        <div class="dash" style="top: 55%; left: 2px;">- 40</div>
        <div class="dash" style="top: 55%; right: 2px;">- 60</div>
        <div class="dash" style="top: 80%; left: 2px;">- 70</div>
        <div class="dash" style="top: 80%; right: 2px;">- 90</div>
    </div>

    <div id="list-page">
        <div class="header"><h1 style="color: var(--ios-gold);">備忘錄</h1></div>
        <div class="note-item" onclick="openNote()">
            <div style="font-weight: 600; font-size: 17px;">動物編號百科</div>
            <div style="font-size: 15px; color: #8e8e93;">下午 2:30 1.獅子 2.老虎...</div>
        </div>
    </div>

    <div id="content-page">
        <div class="nav-bar" onclick="toggleMode()">
            <span style="font-size: 28px; margin-right: 5px;">‹</span> 備忘錄
        </div>
        
        <div class="content-area">
            <div id="animal-container"></div>
        </div>

        <div id="secret-zones">
            <div id="zero-nine-zone" class="trigger" data-base="0"></div>
            <div id="grid-zone">
                <div class="trigger" data-base="10"></div>
                <div class="trigger" data-base="20"></div>
                <div class="trigger" data-base="30"></div>
                <div class="trigger" data-base="40"></div>
                <div class="trigger" data-base="50"></div>
                <div class="trigger" data-base="60"></div>
                <div class="trigger" data-base="70"></div>
                <div class="trigger" data-base="80"></div>
                <div class="trigger" data-base="90"></div>
            </div>
        </div>
    </div>

    <script>
        const rawAnimals = ["獅子", "老虎", "大象", "長頸鹿", "斑馬", "袋鼠", "企鵝", "海豚", "獵豹", "河馬", "犀牛", "黑猩猩", "無尾熊", "火烈鳥", "北極熊", "海龜", "駱駝", "狼", "狐狸", "浣熊", "松鼠", "兔子", "蝙蝠", "刺蝟", "水獺", "海豹", "鯨魚", "鯊魚", "章魚", "水母", "鸚鵡", "老鷹", "鴞", "孔雀", "天鵝", "鱷魚", "變色龍", "蛇", "青蛙", "蟬", "蝴蝶", "蜜蜂", "螞蟻", "瓢蟲", "蜘蛛", "蠍子", "大猩猩", "羚羊", "馴鹿", "犰狳", "獺狸", "樹懶", "食蟻獸", "鴨嘴獸", "土撥鼠", "野豬", "犛牛", "羊駝", "水牛", "黑豹", "金絲猴", "貓頭鷹", "啄木鳥", "鵜鶘", "信天翁", "鴕鳥", "奇異鳥", "蜂鳥", "金魚", "熱帶魚", "海馬", "螃蟹", "龍蝦", "海星", "珊瑚", "大鯢", "壁虎", "蜥蜴", "烏龜", "蠶", "螢火蟲", "蜻蜓", "螳螂", "蚱蜢", "蝸牛", "蛞蝓", "蚯蚓", "麋鹿", "土狼", "小熊貓", "北極狐", "雪豹", "藏羚羊", "麝香鹿", "犀鳥", "火雞", "梅花鹿", "野兔", "土豚", "鼬鼠"];

        let currentTarget = null;
        let startY = 0;
        let baseNum = 0;
        let isShowMode = false; 

        function buildList() {
            const container = document.getElementById('animal-container');
            container.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const div = document.createElement('div');
                div.className = 'animal-line';
                div.id = `animal-${i}`;
                div.innerText = `${i}. ${rawAnimals[i-1]}`;
                container.appendChild(div);
            }
        }

        // 切換模式的開關
        function toggleMode() {
            isShowMode = !isShowMode;
            if (isShowMode) {
                document.getElementById('main-body').classList.add('show-mode');
                // 解鎖後可以滑動了
            } else {
                document.getElementById('main-body').classList.remove('show-mode');
            }
        }

        function openNote() {
            document.getElementById('list-page').style.display = 'none';
            document.getElementById('content-page').style.display = 'block';
            isShowMode = false; // 進入時預設為設定模式
            document.getElementById('main-body').classList.remove('show-mode');
            window.scrollTo(0, 0);
        }

        function goBack() {
            // 這裡本來是回列表，但在魔術中，點擊這裡也可以當作「解鎖」
            // 如果你想真的回列表，可以長按或雙擊，這裡先設為單擊解鎖
            toggleMode();
        }

        const triggers = document.querySelectorAll('.trigger');
        const indicator = document.getElementById('force-indicator');

        triggers.forEach(el => {
            el.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                baseNum = parseInt(el.getAttribute('data-base'));
                indicator.innerText = baseNum === 0 ? 1 : baseNum;
            });

            el.addEventListener('touchmove', (e) => {
                let moveY = e.touches[0].clientY;
                let diff = Math.floor((startY - moveY) / 15);
                if (diff < 0) diff = 0;
                if (diff > 9) diff = 9;
                
                currentTarget = baseNum + diff;
                if (currentTarget === 0) currentTarget = 1;
                indicator.innerText = currentTarget;
            });

            el.addEventListener('touchend', () => {
                if (currentTarget) {
                    buildList(); 
                    const targetEl = document.getElementById(`animal-${currentTarget}`);
                    if (targetEl) {
                        targetEl.innerText = `${currentTarget}. 熊貓`;
                    }
                }
                // 自動隱藏提示
                setTimeout(() => { indicator.innerText = ''; }, 1000);
            });
        });

        buildList();
    </script>
</body>
</html>
