<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="備忘錄">
    
    <title>備忘錄</title>
    <style>
        :root {
            --ios-gold: #d4a373;
            --ios-bg: #ffffff;
            --ios-divider: #c6c6c8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--ios-bg);
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior-y: contain; /* 禁用下拉刷新 */
        }

        /* 隱藏的數字提示器 */
        #force-indicator {
            position: fixed;
            top: 10px;
            left: 15px;
            font-size: 14px;
            font-weight: 600;
            color: rgba(0, 0, 0, 0.06); /* 極淡顏色，觀眾不易察覺 */
            z-index: 1001;
        }

        /* 列表頁面 */
        #list-page { display: block; padding-top: 20px; }
        .header { padding: 10px 20px; }
        h1 { font-size: 34px; margin: 5px 0; font-weight: 700; color: #000; }

        .note-item {
            padding: 12px 20px;
            border-bottom: 0.5px solid var(--ios-divider);
            margin-left: 20px;
            padding-left: 0;
        }

        .note-title { font-weight: 600; font-size: 17px; margin-bottom: 2px; }
        .note-subtitle { font-size: 15px; color: #8e8e93; }

        /* 內容頁面 */
        #content-page { display: none; position: relative; padding-top: 20px; }
        .nav-bar {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            color: var(--ios-gold);
            font-size: 17px;
            font-weight: 400;
        }

        .content-area { padding: 0 20px 120px 20px; }
        .intro-text { font-size: 17px; margin: 15px 0; line-height: 1.5; color: #000; }
        
        .animal-line {
            padding: 12px 0;
            border-bottom: 0.5px solid #efeff4;
            font-size: 17px;
            color: #333;
        }

        /* 隱藏的九宮格感應區 (位於螢幕中下方) */
        #secret-grid {
            position: fixed;
            bottom: 50px;
            left: 0;
            width: 100%;
            height: 55%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            z-index: 9999;
            opacity: 0;
            touch-action: none;
        }
    </style>
</head>
<body>

    <div id="force-indicator"></div>

    <div id="list-page">
        <div class="header">
            <h1 style="color: var(--ios-gold);">備忘錄</h1>
        </div>
        <div class="note-item" onclick="openNote()">
            <div class="note-title">100種動物編碼表</div>
            <div class="note-subtitle">下午 2:30 1.獅子 2.老虎 3.大象...</div>
        </div>
        <div class="note-item">
            <div class="note-title">個人筆記</div>
            <div class="note-subtitle">昨天 11:15 記得去取貨...</div>
        </div>
    </div>

    <div id="content-page">
        <div class="nav-bar" onclick="goBack()">
            <span style="font-size: 28px; margin-right: 5px; margin-top: -2px;">‹</span> 備忘錄
        </div>

        <div class="content-area">
            <div class="intro-text">
                這是一份完整的動物名錄，請隨意滑動選擇一個編號。
            </div>
            <div id="animal-container">
                </div>
        </div>

        <div id="secret-grid">
            <div class="grid-cell" data-base="10"></div>
            <div class="grid-cell" data-base="20"></div>
            <div class="grid-cell" data-base="30"></div>
            <div class="grid-cell" data-base="40"></div>
            <div class="grid-cell" data-base="50"></div>
            <div class="grid-cell" data-base="60"></div>
            <div class="grid-cell" data-base="70"></div>
            <div class="grid-cell" data-base="80"></div>
            <div class="grid-cell" data-base="90"></div>
        </div>
    </div>

    <script>
        const rawAnimals = ["獅子", "老虎", "大象", "長頸鹿", "斑馬", "袋鼠", "企鵝", "海豚", "獵豹", "河馬", "犀牛", "黑猩猩", "無尾熊", "火烈鳥", "北極熊", "海龜", "駱駝", "狼", "狐狸", "浣熊", "松鼠", "兔子", "蝙蝠", "刺蝟", "水獺", "海豹", "鯨魚", "鯊魚", "章魚", "水母", "鸚鵡", "老鷹", "鴞", "孔雀", "天鵝", "鱷魚", "變色龍", "蛇", "青蛙", "蟬", "蝴蝶", "蜜蜂", "螞蟻", "瓢蟲", "蜘蛛", "蠍子", "大猩猩", "羚羊", "馴鹿", "犰狳", "獺狸", "樹懶", "食蟻獸", "鴨嘴獸", "土撥鼠", "野豬", "犛牛", "羊駝", "水牛", "黑豹", "金絲猴", "貓頭鷹", "啄木鳥", "鵜鶘", "信天翁", "鴕鳥", "奇異鳥", "蜂鳥", "金魚", "熱帶魚", "海馬", "螃蟹", "龍蝦", "海星", "珊瑚", "大鯢", "壁虎", "蜥蜴", "烏龜", "蠶", "螢火蟲", "蜻蜓", "螳螂", "蚱蜢", "蝸牛", "蛞蝓", "蚯蚓", "麋鹿", "土狼", "小熊貓", "北極狐", "雪豹", "藏羚羊", "麝香鹿", "犀鳥", "火雞", "梅花鹿", "野兔", "土豚", "鼬鼠"];

        let currentTarget = null;
        let startY = 0;
        let baseNum = 0;
        const sensitivity = 15; // 滑動 15px 數字 +1

        function buildList() {
            const container = document.getElementById('animal-container');
            container.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const div = document.createElement('div');
                div.className = 'animal-line';
                div.id = `animal-${i}`;
                div.innerText = `${i}. ${rawAnimals[i-1]}`;
                container.appendChild(div);
            }
        }

        function openNote() {
            document.getElementById('list-page').style.display = 'none';
            document.getElementById('content-page').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function goBack() {
            document.getElementById('list-page').style.display = 'block';
            document.getElementById('content-page').style.display = 'none';
            document.getElementById('force-indicator').innerText = ''; 
        }

        const cells = document.querySelectorAll('.grid-cell');
        const indicator = document.getElementById('force-indicator');

        cells.forEach(cell => {
            cell.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                baseNum = parseInt(cell.getAttribute('data-base'));
                currentTarget = baseNum;
                indicator.innerText = currentTarget;
            });

            cell.addEventListener('touchmove', (e) => {
                let moveY = e.touches[0].clientY;
                // 往上滑：startY > moveY
                let diff = Math.floor((startY - moveY) / sensitivity);
                
                if (diff < 0) diff = 0;
                if (diff > 9) diff = 9;
                
                currentTarget = baseNum + diff;
                indicator.innerText = currentTarget;
            });

            cell.addEventListener('touchend', () => {
                if (currentTarget) {
                    const targetEl = document.getElementById(`animal-${currentTarget}`);
                    if (targetEl) {
                        targetEl.innerText = `${currentTarget}. 熊貓`;
                    }
                }
                // 3秒後隱藏提示數字，或是保持極淡
                setTimeout(() => { indicator.innerText = ''; }, 2000);
            });
        });

        buildList();
    </script>
</body>
</html>
