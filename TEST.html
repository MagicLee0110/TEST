<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notes</title>
    <style>
        :root {
            --ios-yellow: #ffb100;
            --ios-bg: #f2f2f7; /* iOS 清單頁背景色 */
            --ios-white: #ffffff;
            --ios-gray: #8e8e93;
            --ios-sep: #d1d1d6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ios-bg);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- 頁面切換控制 --- */
        .page { display: none; min-height: 100vh; }
        .page.active { display: block; }

        /* --- 主分頁樣式 (Home View) --- */
        .home-header {
            padding: 40px 16px 10px 16px;
            background: var(--ios-bg);
        }
        .home-header h1 { font-size: 34px; font-weight: 700; margin: 0; }
        .home-header .edit-btn { color: var(--ios-yellow); float: right; font-size: 17px; }

        .search-bar {
            margin: 10px 16px;
            background: #e3e3e8;
            border-radius: 10px;
            padding: 8px 12px;
            color: #8e8e93;
            font-size: 17px;
        }

        .note-group {
            margin: 20px 16px;
            background: var(--ios-white);
            border-radius: 12px;
            overflow: hidden;
        }

        .note-row {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            border-bottom: 0.5px solid var(--ios-sep);
            cursor: pointer;
            position: relative;
        }
        .note-row:last-child { border-bottom: none; }
        .note-row:active { background-color: #e5e5ea; }
        .note-row .title { font-size: 17px; font-weight: 600; color: #000; margin-bottom: 2px; }
        .note-row .desc { font-size: 15px; color: var(--ios-gray); }
        .note-row::after {
            content: "〉";
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #c7c7cc;
            font-size: 14px;
        }

        /* --- 內容頁樣式 (Note View) --- */
        #note-view { background-color: var(--ios-white); }
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            color: var(--ios-yellow);
            font-size: 17px;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            z-index: 3000;
            border-bottom: 0.5px solid var(--ios-sep);
        }
        .back-btn { cursor: pointer; }
        .back-btn::before { content: "〈 "; font-weight: 600; }

        /* 原有功能組件 */
        #force-indicator {
            position: fixed; top: 60px; left: 8px; font-size: 10px;
            color: rgba(0, 0, 0, 0.05); z-index: 4000; pointer-events: none; display: none;
        }
        .marker { position: fixed; width: 8px; height: 1px; background-color: rgba(0, 0, 0, 0.08); z-index: 3500; pointer-events: none; }
        #m10 { top: 350px; left: 0; } #m40 { top: 500px; left: 0; } #m70 { top: 650px; left: 0; }
        #m30 { top: 350px; right: 0; } #m60 { top: 500px; right: 0; } #m90 { top: 650px; right: 0; }

        #trigger-zero { position: fixed; top: 50px; left: 0; width: 100%; height: 300px; z-index: 2500; background: transparent; }
        #trigger-grid {
            position: fixed; top: 350px; left: 0; width: 100%; height: 450px; z-index: 2500;
            display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr;
        }

        .content-wrap { padding: 0 20px 100px 20px; }
        .note-date { color: var(--ios-gray); text-align: center; font-size: 13px; margin: 15px 0; }
        h1.note-title { font-size: 28px; font-weight: 800; margin: 0 0 12px 0; }
        .intro-text { font-size: 17px; line-height: 1.5; margin-bottom: 25px; color: #1c1c1e; }
        .list-container { border-top: 0.5px solid var(--ios-sep); }
        .item { display: flex; padding: 12px 0; border-bottom: 0.5px solid var(--ios-sep); font-size: 17px; }
        .num-label { width: 45px; color: var(--ios-gray); }
    </style>
</head>
<body>

    <div id="home-view" class="page active">
        <div class="home-header">
            <span class="edit-btn">編輯</span>
            <h1>備忘錄</h1>
        </div>
        <div class="search-bar">搜尋</div>
        
        <div class="note-group">
            <div class="note-row" onclick="openNote()">
                <div class="title">100種動物研究清單</div>
                <div class="desc">21:42 這是一份用於心靈感應實驗的...</div>
            </div>
            <div class="note-row">
                <div class="title">購物清單</div>
                <div class="desc">昨天 雞蛋、牛奶、咖啡豆</div>
            </div>
            <div class="note-row">
                <div class="title">靈感筆記</div>
                <div class="desc">2025年12月25日 關於新的撲克牌魔術流程...</div>
            </div>
        </div>
    </div>

    <div id="note-view" class="page">
        <div id="force-indicator">0</div>
        
        <div id="m10" class="marker"></div><div id="m30" class="marker"></div>
        <div id="m40" class="marker"></div><div id="m60" class="marker"></div>
        <div id="m70" class="marker"></div><div id="m90" class="marker"></div>

        <div class="nav-bar">
            <div class="back-btn" onclick="closeNote()">備忘錄</div>
            <div style="color: #333; font-weight: 600;">清單</div>
            <div style="font-weight: 500;">完成</div>
        </div>

        <div id="trigger-zero" class="grid-cell" data-start="0"></div>
        <div id="trigger-grid">
            <div class="grid-cell" data-start="10"></div> <div class="grid-cell" data-start="20"></div>
            <div class="grid-cell" data-start="30"></div> <div class="grid-cell" data-start="40"></div>
            <div class="grid-cell" data-start="50"></div> <div class="grid-cell" data-start="60"></div>
            <div class="grid-cell" data-start="70"></div> <div class="grid-cell" data-start="80"></div>
            <div class="grid-cell" data-start="90"></div>
        </div>

        <div class="content-wrap">
            <div class="note-date">2026年1月2日 21:42</div>
            <h1 class="note-title">100種動物研究清單</h1>
            <p class="intro-text">這是一份用於心靈感應實驗的專用清單。每一種動物都代表了一個特定的編號，請隨意捲動瀏覽。</p>
            <div id="main-list" class="list-container"></div>
        </div>
    </div>

    <script>
        // 頁面切換功能
        function openNote() {
            document.getElementById('home-view').classList.remove('active');
            document.getElementById('note-view').classList.add('active');
            window.scrollTo(0, 0);
        }

        function closeNote() {
            document.getElementById('note-view').classList.remove('active');
            document.getElementById('home-view').classList.add('active');
        }

        // --- 原有邏輯保持不變 ---
        const listEl = document.getElementById('main-list');
        const indicatorEl = document.getElementById('force-indicator');
        
        let animals = ["非洲獅", "孟加拉虎", "亞洲象", "網紋長頸鹿", "平原斑馬", "紅袋鼠", "無尾熊", "皇帝企鵝", "河馬", "白犀牛", "山地大猩猩", "松鼠猴", "赤狐", "北極狼", "灰熊", "北極熊", "熊貓", "單峰駱駝", "加拿大馬鹿", "黑尾牛羚", "瓶鼻海豚", "藍鯨", "大白鯊", "綠蠵龜", "大王具足蟲", "月亮水母", "澳洲龍蝦", "大閘蟹", "紅海星", "大肚海馬", "安地斯神鷹", "白頭海鵰", "倉鴞", "金剛鸚鵡", "藍孔雀", "疣鼻天鵝", "美洲紅鸛", "普通翠鳥", "五色鳥", "麻雀", "高冠變色龍", "科摩多龍", "象龜", "尼羅鱷", "眼鏡蛇", "紅眼樹蛙", "大蟾蜍", "雲南蠑螈", "義大利蜂", "大樺斑蝶", "薄翅蜻蜓", "非洲綠螳螂", "熊蟬", "紅火蟻", "非洲大蝸牛", "白額高腳蛛", "帝王蠍", "小狐蝠", "赤腹松鼠", "荷蘭垂耳兔", "溝鼠", "非洲刺蝟", "水豚", "蜂猴", "三趾樹懶", "北美浣熊", "臭鼬", "黑尾土撥鼠", "九帶犰狳", "鴨嘴獸", "印度獵豹", "美洲豹", "雲豹", "雪豹", "黑豹", "斑點鬣狗", "野豬", "馴鹿", "犛牛", "羊駝", "羚牛", "劍羚", "麝牛", "綠頭鴨", "灰雁", "七面鳥", "鵪鶉", "原鴿", "小嘴烏鴉", "喜鵲", "黑脊鷗", "澳洲鵜鶘", "鸕鶿", "非洲鴕鳥", "鴯鶓", "幾維鳥", "大嘴鳥", "犀鳥", "蜂鳥", "蝙蝠"];

        let startY = 0;
        let baseValue = 0;
        let finalForcedNum = 0;
        const sensitivity = 15; 

        function buildList() {
            listEl.innerHTML = animals.map((a, i) => `
                <div class="item">
                    <div class="num-label">${i + 1}.</div>
                    <div class="name-label">${a}</div>
                </div>
            `).join('');
        }

        const cells = document.querySelectorAll('.grid-cell');
        cells.forEach(cell => {
            cell.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                baseValue = parseInt(cell.getAttribute('data-start'));
                finalForcedNum = baseValue;
                
                let initialShow = (finalForcedNum === 0) ? 1 : finalForcedNum;
                indicatorEl.innerText = initialShow;
                indicatorEl.style.display = 'block';
            });

            cell.addEventListener('touchmove', (e) => {
                let currentY = e.touches[0].clientY;
                let distance = startY - currentY; 
                let increment = Math.floor(distance / sensitivity);
                
                let tempNum = baseValue + increment;
                
                if (baseValue === 0) {
                    if (tempNum < 1) tempNum = 1;
                    if (tempNum > 9) tempNum = 9;
                } else {
                    if (tempNum < baseValue) tempNum = baseValue;
                    if (tempNum > baseValue + 9) tempNum = baseValue + 9;
                }
                
                finalForcedNum = tempNum;
                indicatorEl.innerText = finalForcedNum;
            });

            cell.addEventListener('touchend', () => {
                applyForce(finalForcedNum);
                indicatorEl.style.display = 'none';
            });
        });

        function applyForce(targetNum) {
            if (targetNum <= 0) return;
            const targetIdx = targetNum - 1;
            const panda = "熊貓";
            const oldIdx = animals.indexOf(panda);

            if (oldIdx !== -1 && oldIdx !== targetIdx) {
                let replacedAnimal = animals[targetIdx];
                animals[targetIdx] = panda;
                animals[oldIdx] = replacedAnimal;
                buildList();
            }
        }

        buildList();
    </script>
</body>
</html>
