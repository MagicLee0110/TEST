<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notes</title>
    <style>
        :root {
            --ios-yellow: #ffb100;
            --ios-bg: #ffffff;
            --ios-gray: #8e8e93;
            --marker-color: rgba(0, 0, 0, 0.45); /* 稍微加深的提示色 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ios-bg);
            margin: 0;
            padding: 0;
            overflow-y: scroll;
            user-select: none;
            -webkit-user-select: none;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            color: var(--ios-yellow);
            font-size: 17px;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            z-index: 3000;
            border-bottom: 0.5px solid #d1d1d6;
        }

        .back-btn::before { content: "〈 "; font-weight: 600; }

        /* 秘密指示器 */
        #force-indicator {
            position: fixed;
            top: 60px;
            left: 10px;
            font-size: 12px;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.15); 
            z-index: 4000;
            pointer-events: none;
            display: none;
        }

        /* 感應區容器：九宮格整體下移 */
        .trigger-container {
            position: fixed;
            left: 0;
            width: 100%;
            z-index: 2500;
            pointer-events: none; /* 關鍵：讓觸摸可以穿透到下層捲動 */
        }

        .grid-cell {
            pointer-events: auto; /* 只有格子本身接收觸摸 */
            background: transparent;
            /* debug 用：若要看格子位置，請取消下面這行註釋 */
            /* background: rgba(255,0,0,0.05); border: 0.1px solid rgba(0,0,0,0.05); */
        }

        #trigger-zero {
            top: 60px;
            height: 80px;
            width: 100%;
        }

        #trigger-grid {
            top: 280px; /* 整個九宮格下移 */
            height: 420px; 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        /* 邊緣提示標記 (-) */
        .edge-marker {
            position: fixed;
            font-size: 16px;
            font-weight: bold;
            color: var(--marker-color);
            pointer-events: none;
            z-index: 2600;
        }
        
        /* 0-9 區標記 */
        .m-top { top: 90px; left: 50%; transform: translateX(-50%); }
        
        /* 九宮格標記 (左、右對應每一橫排中心) */
        .m-l1, .m-r1 { top: 350px; } /* 第一排 (10, 20, 30) */
        .m-l2, .m-r2 { top: 490px; } /* 第二排 (40, 50, 60) */
        .m-l3, .m-r3 { top: 630px; } /* 第三排 (70, 80, 90) */

        .m-l1, .m-l2, .m-l3 { left: 5px; }
        .m-r1, .m-r2, .m-r3 { right: 5px; }

        .content-wrap { padding: 0 20px 100px 20px; }
        .note-date { color: var(--ios-gray); text-align: center; font-size: 13px; margin: 15px 0; }
        h1 { font-size: 28px; font-weight: 800; margin: 0 0 12px 0; }
        .intro-text { font-size: 17px; line-height: 1.5; margin-bottom: 25px; color: #1c1c1e; }
        .list-container { border-top: 0.5px solid #d1d1d6; }
        .item { display: flex; padding: 12px 0; border-bottom: 0.5px solid #d1d1d6; font-size: 17px; }
        .num-label { width: 45px; color: var(--ios-gray); }
    </style>
</head>
<body>

    <div class="edge-marker m-top">-</div>
    <div class="edge-marker m-l1">-</div>
    <div class="edge-marker m-l2">-</div>
    <div class="edge-marker m-l3">-</div>
    <div class="edge-marker m-r1">-</div>
    <div class="edge-marker m-r2">-</div>
    <div class="edge-marker m-r3">-</div>

    <div id="force-indicator">0</div>

    <div class="nav-bar">
        <div class="back-btn">備忘錄</div>
        <div style="color: #333; font-weight: 600;">動物百科</div>
        <div>完成</div>
    </div>

    <div id="trigger-zero" class="trigger-container grid-cell" data-start="0"></div>

    <div id="trigger-grid" class="trigger-container">
        <div class="grid-cell" data-start="10"></div>
        <div class="grid-cell" data-start="20"></div>
        <div class="grid-cell" data-start="30"></div>
        <div class="grid-cell" data-start="40"></div>
        <div class="grid-cell" data-start="50"></div>
        <div class="grid-cell" data-start="60"></div>
        <div class="grid-cell" data-start="70"></div>
        <div class="grid-cell" data-start="80"></div>
        <div class="grid-cell" data-start="90"></div>
    </div>

    <div class="content-wrap">
        <div class="note-date">2026年1月2日 21:20</div>
        <h1>世界動物完整清單</h1>
        <p class="intro-text">
            此清單按類別編號，包含全球 100 種具代表性的生物。
        </p>

        <div id="main-list" class="list-container"></div>
    </div>

    <script>
        const listEl = document.getElementById('main-list');
        const indicatorEl = document.getElementById('force-indicator');
        
        let animals = ["非洲獅", "孟加拉虎", "亞洲象", "網紋長頸鹿", "平原斑馬", "紅袋鼠", "無尾熊", "皇帝企鵝", "河馬", "白犀牛", "山地大猩猩", "松鼠猴", "赤狐", "北極狼", "灰熊", "北極熊", "熊貓", "單峰駱駝", "加拿大馬鹿", "黑尾牛羚", "瓶鼻海豚", "藍鯨", "大白鯊", "綠蠵龜", "大王具足蟲", "月亮水母", "澳洲龍蝦", "大閘蟹", "紅海星", "大肚海馬", "安地斯神鷹", "白頭海鵰", "倉鴞", "金剛鸚鵡", "藍孔雀", "疣鼻天鵝", "美洲紅鸛", "普通翠鳥", "五色鳥", "麻雀", "高冠變色龍", "科摩多龍", "象龜", "尼羅鱷", "眼鏡蛇", "紅眼樹蛙", "大蟾蜍", "雲南蠑螈", "義大利蜂", "大樺斑蝶", "薄翅蜻蜓", "非洲綠螳螂", "熊蟬", "紅火蟻", "非洲大蝸牛", "白額高腳蛛", "帝王蠍", "小狐蝠", "赤腹松鼠", "荷蘭垂耳兔", "溝鼠", "非洲刺蝟", "水豚", "蜂猴", "三趾樹懶", "北美浣熊", "臭鼬", "黑尾土撥鼠", "九帶犰狳", "鴨嘴獸", "印度獵豹", "美洲豹", "雲豹", "雪豹", "黑豹", "斑點鬣狗", "野豬", "馴鹿", "犛牛", "羊駝", "羚牛", "劍羚", "麝牛", "綠頭鴨", "灰雁", "七面鳥", "鵪鶉", "原鴿", "小嘴烏鴉", "喜鵲", "黑脊鷗", "澳洲鵜鶘", "鸕鶿", "非洲鴕鳥", "鴯鶓", "幾維鳥", "大嘴鳥", "犀鳥", "蜂鳥", "蝙蝠"];

        let startY = 0;
        let baseValue = 0;
        let finalForcedNum = 0;
        const sensitivity = 15; 

        function buildList() {
            listEl.innerHTML = animals.map((a, i) => `
                <div class="item">
                    <div class="num-label">${i + 1}.</div>
                    <div class="name-label">${a}</div>
                </div>
            `).join('');
        }

        const cells = document.querySelectorAll('.grid-cell');
        cells.forEach(cell => {
            cell.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                baseValue = parseInt(cell.getAttribute('data-start'));
                finalForcedNum = (baseValue === 0) ? 1 : baseValue;
                
                indicatorEl.innerText = finalForcedNum;
                indicatorEl.style.display = 'block';
            });

            cell.addEventListener('touchmove', (e) => {
                let currentY = e.touches[0].clientY;
                let distance = startY - currentY; 
                let increment = Math.floor(distance / sensitivity);
                
                let tempNum = baseValue + increment;
                
                if (baseValue === 0) {
                    tempNum = Math.max(1, Math.min(9, tempNum));
                } else {
                    tempNum = Math.max(baseValue, Math.min(baseValue + 9, tempNum));
                }
                
                finalForcedNum = tempNum;
                indicatorEl.innerText = finalForcedNum;
                // 注意：這裡不寫 e.preventDefault()，所以頁面會跟著捲動，這是正常的掩護。
            });

            cell.addEventListener('touchend', () => {
                applyForce(finalForcedNum);
                indicatorEl.style.display = 'none';
            });
        });

        function applyForce(targetNum) {
            if (!targetNum || targetNum <= 0) return;
            const targetIdx = targetNum - 1;
            const panda = "熊貓";
            
            // 找到熊貓目前在哪
            let currentPandaIdx = animals.indexOf(panda);

            // 如果找到熊貓，且位置不對，就交換
            if (currentPandaIdx !== -1 && currentPandaIdx !== targetIdx) {
                let replacedAnimal = animals[targetIdx];
                animals[targetIdx] = panda;
                animals[currentPandaIdx] = replacedAnimal;
                buildList();
            }
        }

        buildList();
    </script>
</body>
</html>
