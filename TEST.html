<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>iOS 26 Unlock</title>
    <style>
        /* 全域設定 */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --press-color: rgba(255, 255, 255, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* 鍵盤靠下 */
            align-items: center;
            overflow: hidden;
            /* 模擬 iOS 26 未來感流體背景 */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(60, 20, 100, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(20, 80, 100, 0.6) 0%, transparent 40%),
                linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            background-size: cover;
            user-select: none;
            -webkit-user-select: none;
            color: var(--text-color);
        }

        /* 狀態列模擬 */
        .status-bar {
            position: absolute;
            top: 0;
            width: 100%;
            height: 44px; /* iPhone 瀏海高度區 */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            font-size: 14px;
            font-weight: 600;
            z-index: 10;
        }

        /* 解鎖提示區 */
        .header-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .lock-icon {
            font-size: 40px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .instruction {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* 密碼圓點 */
        .dots-container {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1.5px solid #fff;
            background: transparent;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .dot.active {
            background: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

        /* 錯誤搖晃動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* 數字鍵盤區 */
        .keypad {
            width: 100%;
            max-width: 320px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            row-gap: 25px; /* iOS 風格間距 */
            column-gap: 30px;
            margin-bottom: 60px; /* 底部留白 */
            padding-bottom: env(safe-area-inset-bottom);
        }

        .key-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .key {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }

        .key:active {
            background: var(--press-color);
        }

        .key-num {
            font-size: 32px;
            font-weight: 400;
            line-height: 1;
        }

        .key-sub {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-top: 2px;
            opacity: 0.7;
        }

        /* 底部功能鍵 (緊急 / 刪除) */
        .bottom-action {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: transparent;
            border: none;
            padding: 25px; /* 增加點擊範圍 */
            opacity: 0.8;
        }
        
        .bottom-action:active {
            opacity: 0.4;
        }

        /* 解鎖後的畫面 (模擬進入桌面) */
        #home-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1621360841012-3f6266d6d2d3?q=80&w=2560&auto=format&fit=crop') center/cover;
            z-index: 100;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 100px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
            width: 90%;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            border-radius: 14px;
            backdrop-filter: blur(10px);
        }

    </style>
</head>
<body>

    <div class="status-bar">
        <span id="clock-time">09:41</span>
        <div style="display: flex; gap: 5px; align-items: center;">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><path d="M14 0H2C0.9 0 0 0.9 0 2v8c0 1.1 0.9 2 2 2h12c1.1 0 2-0.9 2-2V2c0-1.1-0.9-2-2-2zM14 10H2V2h12v8z"/></svg> <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor"><rect x="1" y="1" width="20" height="10" rx="2" stroke="white" fill="none"/><rect x="3" y="3" width="16" height="6" rx="1" fill="white"/><path d="M23 4v4" stroke="white" stroke-width="2"/></svg> </div>
    </div>

    <div id="lock-interface" class="header-section">
        <div class="lock-icon">🔒</div>
        <div class="instruction">輸入密碼</div>
        
        <div class="dots-container" id="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="keypad">
        <div class="key-wrapper"><div class="key" onclick="pressKey(1)"><span class="key-num">1</span><span class="key-sub">&nbsp;</span></div></div>
        <div class="key-wrapper"><div class="key" onclick="pressKey(2)"><span class="key-num">2</span><span class="key-sub">ABC</span></div></div>
        <div class="key-wrapper"><div class="key" onclick="pressKey(3)"><span class="key-num">3</span><span class="key-sub">DEF</span></div></div>
        <div class="key-wrapper"><div class="key" onclick="pressKey(4)"><span class="key-num">4</span><span class="key-sub">GHI</span></div></div>
        <div class="key-wrapper"><div class="key" onclick="pressKey(5)"><span class="key-num">5</span><span class="key-sub">JKL</span></div></div>
        <div class="key-wrapper"><div class="key" onclick="pressKey(6)"><span class="key-num">6</span><span class="key-sub">MNO</span></div></div>
        <div class="key-wrapper"><div class="key" onclick="pressKey(7)"><span class="key-num">7</span><span class="key-sub">PQRS</span></div></div>
        <div class="key-wrapper"><div class="key" onclick="pressKey(8)"><span class="key-num">8</span><span class="key-sub">TUV</span></div></div>
        <div class="key-wrapper"><div class="key" onclick="pressKey(9)"><span class="key-num">9</span><span class="key-sub">WXYZ</span></div></div>
        
        <div class="key-wrapper"><button class="bottom-action" onclick="alert('緊急服務模擬')">緊急服務</button></div>
        <div class="key-wrapper"><div class="key" onclick="pressKey(0)"><span class="key-num">0</span></div></div>
        <div class="key-wrapper"><button class="bottom-action" onclick="deleteKey()">取消</button></div>
    </div>

    <div id="home-screen" style="display:none;">
        <div class="app-grid">
            <div class="app-icon"></div>
            <div class="app-icon"></div>
            <div class="app-icon"></div>
            <div class="app-icon"></div>
            <div style="color:white; grid-column: 1/-1; text-align: center; margin-top: 20px; font-weight:300;">
                歡迎回來<br>iOS 26 模擬桌面
            </div>
        </div>
    </div>

    <script>
        // 設定正確密碼
        const CORRECT_PASS = '123456'; 
        let currentInput = '';
        const dots = document.querySelectorAll('.dot');
        const lockInterface = document.getElementById('lock-interface');
        const homeScreen = document.getElementById('home-screen');

        // 更新時間
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock-time').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 按鍵輸入邏輯
        function pressKey(num) {
            if (currentInput.length < 6) {
                currentInput += num;
                updateDots();
                
                // 檢查密碼
                if (currentInput.length === 6) {
                    setTimeout(checkPassword, 200); // 稍微延遲讓最後一個點亮起
                }
            }
        }

        // 刪除鍵邏輯
        function deleteKey() {
            if (currentInput.length > 0) {
                currentInput = currentInput.slice(0, -1);
                updateDots();
            }
        }

        // 更新圓點狀態
        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < currentInput.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        // 檢查密碼
        function checkPassword() {
            if (currentInput === CORRECT_PASS) {
                // 密碼正確
                unlockSuccess();
            } else {
                // 密碼錯誤
                shakeAnimation();
                currentInput = '';
                setTimeout(updateDots, 400); // 動畫結束後清空圓點
            }
        }

        // 錯誤動畫
        function shakeAnimation() {
            const container = document.querySelector('.dots-container');
            container.classList.add('shake');
            // 觸覺回饋 (如果裝置支援)
            if (navigator.vibrate) navigator.vibrate(200);
            
            setTimeout(() => {
                container.classList.remove('shake');
            }, 400);
        }

        // 解鎖成功
        function unlockSuccess() {
            // 這裡可以跳轉頁面，或者顯示桌面
            // 模擬解鎖動畫：介面向上滑出或淡出
            document.body.style.transition = "transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)";
            document.querySelector('.keypad').style.opacity = '0';
            lockInterface.style.opacity = '0';
            
            setTimeout(() => {
                document.querySelector('.keypad').style.display = 'none';
                lockInterface.style.display = 'none';
                
                // 顯示模擬桌面
                homeScreen.style.display = 'flex';
                // 強制重繪
                homeScreen.offsetHeight; 
                homeScreen.style.opacity = '1';
                
                // 如果您之後要加上照片相簿，可以在這裡寫 window.location.href = 'album.html';
            }, 500);
        }
    </script>
</body>
</html>
