<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS 通知中心模擬 - 簡潔版</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --card-bg: rgba(40, 40, 40, 0.4);
            --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: var(--font-main);
            color: white;
            overflow: hidden;
            /* 模擬背景漸層 */
            background: linear-gradient(180deg, #1a152e 0%, #3a2b5e 50%, #1a152e 100%);
            background-size: cover;
        }

        /* 時間日期區 - 稍微往下移動補足頂部空間 */
        .clock-container {
            text-align: center;
            margin-top: 60px;
        }

        .date-text {
            font-size: 19px;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .time-text {
            font-size: 95px;
            font-weight: 200;
            margin: 0;
            letter-spacing: -2px;
        }

        /* 通知中心標題 */
        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 25px 15px;
        }

        .notification-header h2 {
            font-size: 28px;
            margin: 0;
            font-weight: 600;
        }

        .close-btn {
            width: 28px; height: 28px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* 通知卡片列表 */
        .notification-list {
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notif-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .notif-top {
            display: flex;
            gap: 12px;
        }

        .notif-icon {
            width: 38px; height: 38px;
            border-radius: 8px;
            background-size: cover;
            position: relative;
        }

        .notif-badge {
            position: absolute;
            top: -5px; right: -5px;
            background: white; color: black;
            font-size: 10px; font-weight: bold;
            padding: 2px 4px; border-radius: 10px;
        }

        .notif-content { flex: 1; }

        .notif-title-row {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .notif-time { font-weight: 400; opacity: 0.6; font-size: 13px; }

        .notif-body {
            font-size: 14px;
            line-height: 1.4;
            opacity: 0.9;
        }

        /* Dcard 按鈕區 */
        .notif-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .action-btn {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-size: 15px;
        }

        /* 底部 Home Bar */
        .home-bar {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 5px;
            background: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <div class="date-text">1月3日 週六 · 乙巳年冬月十五</div>
        <h1 class="time-text">2:38</h1>
    </div>

    <div class="notification-header">
        <h2>通知中心</h2>
        <div class="close-btn">✕</div>
    </div>

    <div class="notification-list">
        <div class="notif-card">
            <div class="notif-top">
                <div class="notif-icon" style="background-color: #ff4500; display:flex; align-items:center; justify-content:center; font-weight:bold;">S
                    <span class="notif-badge">23</span>
                </div>
                <div class="notif-content">
                    <div class="notif-title-row">
                        <span>您關注的賣家開始直播了！</span>
                        <span class="notif-time">1小時前</span>
                    </div>
                    <div class="notif-body">觀看 Yomigirls 的直播：神美浩肯包🤩...</div>
                </div>
            </div>
        </div>

        <div class="notif-card">
            <div class="notif-top">
                <div class="notif-icon" style="background-color: #006aa6; display:flex; align-items:center; justify-content:center; font-weight:bold;">D
                    <span class="notif-badge">19</span>
                </div>
                <div class="notif-content">
                    <div class="notif-title-row">
                        <span>你追蹤的「理財板」新文章</span>
                        <span class="notif-time">2小時前</span>
                    </div>
                    <div class="notif-body">「台股瘋了 正二也瘋了」</div>
                </div>
            </div>
            <div style="text-align:center; font-size: 13px; margin-top: 15px; opacity: 0.8;">要繼續接收「Dcard」App的通知嗎？</div>
            <div class="notif-actions">
                <div class="action-btn">繼續⋯</div>
                <div class="action-btn">關閉⋯</div>
            </div>
        </div>

        <div class="notif-card">
            <div class="notif-top">
                <div class="notif-icon" style="background-color: #00c300; display:flex; align-items:center; justify-content:center; font-weight:bold;">L
                    <span class="notif-badge">2</span>
                </div>
                <div class="notif-content">
                    <div class="notif-body">新一季優惠‼️人氣商品◤購好券享 30% 回饋⚡◢ 海底撈、瀧厚炙燒熟成牛排...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="home-bar"></div>

</body>
</html>
