<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>iOS Magic Ultimate</title>
    <style>
        :root {
            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            --handwriting-font: "Cursive", "Bradley Hand", "Marker Felt", sans-serif;
            --main-gradient: linear-gradient(180deg, #000000 0%, #1a152e 40%, #000000 100%);
            --ios-gold: #d4a017;
        }

        html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--ios-font); overflow: hidden; background-color: #000; touch-action: none; }

        /* --- 1. 通知中心 --- */
        #notification-center { width: 100%; height: 100%; background: var(--main-gradient); background-attachment: fixed; position: relative; color: white; display: flex; flex-direction: column; }
        .clock-container { text-align: center; padding-top: calc(env(safe-area-inset-top) + 60px); user-select: none; }
        .time-text { font-size: 95px; font-weight: 200; margin: 0; letter-spacing: -2px; }
        .date-text { font-size: 19px; opacity: 0.9; }
        .notification-header { padding: 40px 25px 15px; font-size: 28px; font-weight: 600; }
        .notif-card { background: rgba(40, 40, 40, 0.4); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-radius: 24px; padding: 15px; margin: 0 15px 12px; display: flex; flex-direction: column; }
        .notif-top { display: flex; gap: 12px; }
        .magic-area { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); z-index: 999; margin-bottom: 40px; }
        .magic-btn { width: 100%; height: 100%; background: transparent; }

        /* --- 2. 備忘錄內頁 (編輯模式) --- */
        #memo-detail { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #fff; display: none; flex-direction: column; z-index: 2000; }
        .memo-header { padding: calc(env(safe-area-inset-top) + 10px) 20px 10px; display: flex; justify-content: space-between; align-items: center; color: var(--ios-gold); font-size: 17px; z-index: 2010; }
        .handwriting-area { flex: 1; display: flex; justify-content: center; align-items: center; font-family: var(--handwriting-font); font-size: 220px; font-weight: 500; color: rgba(255, 255, 255, 0.95); }
        #sketchCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2005; }

        /* --- 3. 備忘錄列表頁 --- */
        #memo-list { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #fff; display: none; flex-direction: column; z-index: 3000; padding-top: env(safe-area-inset-top); }
        .list-header { padding: 20px 20px 10px; }
        .list-header h1 { font-size: 34px; margin: 0; font-weight: 700; }
        .list-container { flex: 1; overflow-y: auto; padding: 10px 20px; }
        .list-item { background: #1c1c1e; padding: 15px; border-radius: 12px; margin-bottom: 1px; display: flex; flex-direction: column; gap: 4px; }
        .list-item:first-child { border-radius: 12px 12px 0 0; }
        .list-item:last-child { border-radius: 0 0 12px 12px; }
        .item-title { font-size: 17px; font-weight: 600; color: #fff; }
        .item-info { font-size: 15px; color: #8e8e93; display: flex; gap: 10px; }

        /* --- 4. 後台 --- */
        #backstage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; color: white; display: none; flex-direction: column; z-index: 4000; padding: calc(env(safe-area-inset-top) + 20px) 20px; }
        .grid-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .grid-inputs input { background: #222; border: 1px solid #444; color: white; padding: 15px 5px; border-radius: 8px; text-align: center; }

        .home-bar { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; background: rgba(255, 255, 255, 0.3); border-radius: 10px; z-index: 5000; }
    </style>
</head>
<body>

    <div id="notification-center">
        <div class="top-content">
            <div class="clock-container" id="clockZone" onclick="openMemo(null)">
                <div class="date-text" id="dateDisplay">1月3日 週六</div>
                <h1 class="time-text" id="timeDisplay">15:02</h1>
            </div>
            <div class="notification-header">通知中心</div>
            <div class="notif-card">
                <div class="notif-top">
                    <div style="width:38px; height:38px; background:#ff4500; border-radius:8px;"></div>
                    <div style="flex:1; margin-left:12px;">
                        <div style="display:flex; justify-content:space-between; font-size:15px; font-weight:600;"><span>備忘錄</span><span style="opacity:0.6; font-size:13px;">剛剛</span></div>
                        <div style="font-size:14px; opacity:0.9;">這裡有一些重要筆記...</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="magic-area">
            <div class="magic-btn" onclick="openMemo(0)"></div><div class="magic-btn" onclick="openMemo(1)"></div><div class="magic-btn" onclick="openMemo(2)"></div>
            <div class="magic-btn" onclick="openMemo(3)"></div><div class="magic-btn" onclick="openMemo(4)"></div><div class="magic-btn" onclick="openMemo(5)"></div>
            <div class="magic-btn" onclick="openMemo(6)"></div><div class="magic-btn" onclick="openMemo(7)"></div><div class="magic-btn" onclick="openMemo(8)"></div>
        </div>
        <div class="home-bar" onclick="location.reload()"></div>
    </div>

    <div id="memo-detail">
        <div class="memo-header">
            <span onclick="goToNoteList()">＜ 備忘錄</span>
            <span style="font-weight:600;" onclick="closeAll()">完成</span>
        </div>
        <div class="memo-content-area">
            <div id="handwritingNumber"></div>
            <canvas id="sketchCanvas"></canvas>
        </div>
        <div class="home-bar"></div>
    </div>

    <div id="memo-list">
        <div class="list-header">
            <div style="color:var(--ios-gold); font-size:17px; margin-bottom:10px;" onclick="closeAll()">＜ 資料夾</div>
            <h1>備忘錄</h1>
        </div>
        <div class="list-container">
            <div class="list-item" onclick="returnToDetail()">
                <div class="item-title" id="listFirstTitle">36</div>
                <div class="item-info"><span>15:02</span><span>尚無額外文字</span></div>
            </div>
            <div class="list-item">
                <div class="item-title">魔術講座筆記 (2025)</div>
                <div class="item-info"><span>12/28</span><span>關於心靈魔術的幾個關鍵動作...</span></div>
            </div>
            <div class="list-item">
                <div class="item-title">晚餐採買清單</div>
                <div class="item-info"><span>12/25</span><span>雞蛋、牛奶、蠟燭、絲巾...</span></div>
            </div>
            <div class="list-item">
                <div class="item-title">讀心學院課程大綱</div>
                <div class="item-info"><span>11/12</span><span>1. 預言技巧 2. 讀心術基礎...</span></div>
            </div>
        </div>
        <div class="home-bar" onclick="closeAll()"></div>
    </div>

    <div id="backstage">
        <div style="text-align:center; font-size:20px; margin-bottom:20px;">九宮格數值設定</div>
        <div class="grid-inputs" id="inputContainer"></div>
        <button onclick="saveSettings()" style="margin-top:20px; background:var(--ios-gold); border:none; padding:15px; width:100%; border-radius:12px; font-weight:bold;">儲存</button>
    </div>

    <script>
        let magicValues = ["36", "45", "54", "63", "72", "81", "90", "12", "07"];
        let currentText = "";
        const savedData = localStorage.getItem('magicNumbers');
        if (savedData) magicValues = JSON.parse(savedData);

        const inputContainer = document.getElementById('inputContainer');
        magicValues.forEach((val, i) => {
            const input = document.createElement('input');
            input.type = 'text'; input.value = val; input.id = `input-${i}`;
            inputContainer.appendChild(input);
        });

        // 長按進入後台
        let pressTimer;
        document.getElementById('clockZone').addEventListener('touchstart', (e) => {
            pressTimer = setTimeout(() => { document.getElementById('backstage').style.display = 'flex'; }, 1500);
        });
        document.getElementById('clockZone').addEventListener('touchend', () => clearTimeout(pressTimer));

        function saveSettings() {
            for (let i = 0; i < 9; i++) magicValues[i] = document.getElementById(`input-${i}`).value;
            localStorage.setItem('magicNumbers', JSON.stringify(magicValues));
            document.getElementById('backstage').style.display = 'none';
        }

        // --- 核心邏輯 ---
        function openMemo(index) {
            document.getElementById('notification-center').style.display = 'none';
            document.getElementById('memo-detail').style.display = 'flex';
            if (index === null) {
                currentText = "新筆記";
                document.getElementById('handwritingNumber').style.display = 'none';
                document.getElementById('sketchCanvas').style.display = 'block';
                clearCanvas();
            } else {
                currentText = magicValues[index];
                document.getElementById('handwritingNumber').textContent = currentText;
                document.getElementById('handwritingNumber').style.display = 'block';
                document.getElementById('sketchCanvas').style.display = 'none';
            }
            // 同步更新列表頁的第一條標題
            document.getElementById('listFirstTitle').textContent = currentText;
        }

        function goToNoteList() {
            document.getElementById('memo-detail').style.display = 'none';
            document.getElementById('memo-list').style.display = 'flex';
        }

        function returnToDetail() {
            document.getElementById('memo-list').style.display = 'none';
            document.getElementById('memo-detail').style.display = 'flex';
        }

        function closeAll() {
            document.getElementById('memo-detail').style.display = 'none';
            document.getElementById('memo-list').style.display = 'none';
            document.getElementById('notification-center').style.display = 'flex';
        }

        // --- 畫布 (Canvas) ---
        const canvas = document.getElementById('sketchCanvas');
        const ctx = canvas.getContext('2d');
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function initCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.95)"; ctx.lineWidth = 10; ctx.lineCap = "round";
        }
        initCanvas();
        let drawing = false;
        canvas.addEventListener('touchstart', (e) => { drawing = true; ctx.beginPath(); });
        canvas.addEventListener('touchmove', (e) => {
            if (!drawing) return; e.preventDefault();
            const x = e.touches[0].clientX; const y = e.touches[0].clientY;
            ctx.lineTo(x, y); ctx.stroke();
        });
        canvas.addEventListener('touchend', () => drawing = false);

        // --- 時間 ---
        function updateClock() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('timeDisplay').textContent = timeStr;
            const weekDays = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
            document.getElementById('dateDisplay').textContent = `${now.getMonth() + 1}月${now.getDate()}日 ${weekDays[now.getDay()]} · 乙巳年冬月十五`;
        }
        setInterval(updateClock, 1000); updateClock();
    </script>
</body>
</html>
