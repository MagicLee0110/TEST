<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>備忘錄</title>
    <style>
        :root {
            --ios-gold: #d4a373;
            --ios-bg: #ffffff;
            --ios-gray: #f2f2f7;
            --ios-divider: #c6c6c8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--ios-bg);
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            /* 防止手機瀏覽器下拉刷新 */
            overscroll-behavior-y: contain; 
        }

        /* iOS 狀態列 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 15px;
            font-weight: 600;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        #force-indicator {
            letter-spacing: -0.5px;
        }

        /* 列表頁 */
        #list-page { display: block; }
        .header { padding: 10px 20px; }
        h1 { font-size: 34px; margin: 5px 0; font-weight: 700; }

        .note-item {
            padding: 12px 20px;
            border-bottom: 0.5px solid var(--ios-divider);
            margin-left: 20px;
            padding-left: 0;
        }

        .note-title { font-weight: 600; font-size: 17px; margin-bottom: 2px; }
        .note-subtitle { font-size: 15px; color: #8e8e93; }

        /* 內容頁 */
        #content-page { display: none; position: relative; }
        .nav-bar {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            color: var(--ios-gold);
            font-size: 17px;
        }

        .content-area { padding: 0 20px 100px 20px; line-height: 1.5; }
        .intro-text { font-size: 17px; margin: 15px 0; color: #000; }
        
        .animal-line {
            padding: 12px 0;
            border-bottom: 0.5px solid #efeff4;
            font-size: 17px;
            color: #333;
        }

        /* 隱藏的九宮格 - 位於螢幕中下方，方便大拇指操作 */
        #secret-grid {
            position: fixed;
            bottom: 10%;
            left: 0;
            width: 100%;
            height: 50%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            z-index: 9999;
            opacity: 0; /* 完全透明 */
            touch-action: none; /* 禁用預設觸控行為 */
        }
    </style>
</head>
<body>

    <div class="status-bar">
        <div id="force-indicator">9:41</div>
        <div style="display: flex; gap: 5px; align-items: center;">
            <span style="font-size: 12px;">📶</span>
            <span style="font-size: 12px;">LTE</span>
            <span style="font-size: 18px;">🔋</span>
        </div>
    </div>

    <div id="list-page">
        <div class="header">
            <h1 style="color: #000;">備忘錄</h1>
        </div>
        <div style="background: white;">
            <div class="note-item" onclick="openNote()">
                <div class="note-title">動物編號清單</div>
                <div class="note-subtitle">下午 2:30 100種不同的生物...</div>
            </div>
            <div class="note-item">
                <div class="note-title">表演注意事項</div>
                <div class="note-subtitle">昨天 11:15 記得保持微笑...</div>
            </div>
        </div>
    </div>

    <div id="content-page">
        <div class="nav-bar" onclick="goBack()">
            <span style="font-size: 24px; margin-right: 5px;">‹</span> 備忘錄
        </div>

        <div class="content-area">
            <div class="intro-text">
                這份清單包含了全世界最受歡迎的 100 種動物。每一種動物都有其獨特的編號，請觀眾隨意挑選一個數字。
            </div>
            <div id="animal-container">
                </div>
        </div>

        <div id="secret-grid">
            <div class="grid-cell" data-base="10"></div>
            <div class="grid-cell" data-base="20"></div>
            <div class="grid-cell" data-base="30"></div>
            <div class="grid-cell" data-base="40"></div>
            <div class="grid-cell" data-base="50"></div>
            <div class="grid-cell" data-base="60"></div>
            <div class="grid-cell" data-base="70"></div>
            <div class="grid-cell" data-base="80"></div>
            <div class="grid-cell" data-base="90"></div>
        </div>
    </div>

    <script>
        const rawAnimals = ["獅子", "老虎", "大象", "長頸鹿", "斑馬", "袋鼠", "企鵝", "海豚", "獵豹", "河馬", "犀牛", "黑猩猩", "無尾熊", "火烈鳥", "北極熊", "海龜", "駱駝", "狼", "狐狸", "浣熊", "松鼠", "兔子", "蝙蝠", "刺蝟", "水獺", "海豹", "鯨魚", "鯊魚", "章魚", "水母", "鸚鵡", "老鷹", "鴞", "孔雀", "天鵝", "鱷魚", "變色龍", "蛇", "青蛙", "蟬", "蝴蝶", "蜜蜂", "螞蟻", "瓢蟲", "蜘蛛", "蠍子", "大猩猩", "羚羊", "馴鹿", "犰狳", "獺狸", "樹懶", "食蟻獸", "鴨嘴獸", "土撥鼠", "野豬", "犛牛", "羊駝", "水牛", "黑豹", "金絲猴", "貓頭鷹", "啄木鳥", "鵜鶘", "信天翁", "鴕鳥", "奇異鳥", "蜂鳥", "金魚", "熱帶魚", "海馬", "螃蟹", "龍蝦", "海星", "珊瑚", "大鯢", "壁虎", "蜥蜴", "烏龜", "蠶", "螢火蟲", "蜻蜓", "螳螂", "蚱蜢", "蝸牛", "蛞蝓", "蚯蚓", "麋鹿", "土狼", "小熊貓", "北極狐", "雪豹", "藏羚羊", "麝香鹿", "犀鳥", "火雞", "梅花鹿", "野兔", "土豚", "鼬鼠"];

        let currentTarget = null;
        let startY = 0;
        let baseNum = 0;
        const sensitivity = 15; // 每滑 15px 數字 +1

        function buildList() {
            const container = document.getElementById('animal-container');
            container.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const div = document.createElement('div');
                div.className = 'animal-line';
                div.id = `animal-${i}`;
                div.innerText = `${i}. ${rawAnimals[i-1]}`;
                container.appendChild(div);
            }
        }

        function openNote() {
            document.getElementById('list-page').style.display = 'none';
            document.getElementById('content-page').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function goBack() {
            document.getElementById('list-page').style.display = 'block';
            document.getElementById('content-page').style.display = 'none';
        }

        // 九宮格邏輯
        const cells = document.querySelectorAll('.grid-cell');
        const indicator = document.getElementById('force-indicator');

        cells.forEach(cell => {
            cell.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                baseNum = parseInt(cell.getAttribute('data-base'));
                updateVisual(baseNum);
            });

            cell.addEventListener('touchmove', (e) => {
                let moveY = e.touches[0].clientY;
                // 往上滑：startY > moveY，所以 (startY - moveY) 是正數
                let diff = Math.floor((startY - moveY) / sensitivity);
                
                if (diff < 0) diff = 0;
                if (diff > 9) diff = 9;
                
                currentTarget = baseNum + diff;
                updateVisual(currentTarget);
            });

            cell.addEventListener('touchend', () => {
                if (currentTarget) {
                    // 偷偷把目標數字改成 熊貓
                    const targetEl = document.getElementById(`animal-${currentTarget}`);
                    if (targetEl) {
                        targetEl.innerText = `${currentTarget}. 熊貓`;
                    }
                }
                indicator.innerText = "9:41"; // 結束後恢復正常時間
            });
        });

        function updateVisual(num) {
            // 偷偷顯示在左上角時間處
            indicator.innerText = `9:${num}`;
        }

        buildList();
    </script>
</body>
</html>
