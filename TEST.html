<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>照片</title>
    <style>
        :root {
            --ios-blue: #0a84ff;
            --dock-bg: rgba(28, 28, 30, 0.8);
            --blur: blur(40px) saturate(210%);
            --ios-ease: cubic-bezier(0.3, 1, 0.3, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }

        body { margin: 0; background-color: #000; color: #fff; overflow: hidden; position: fixed; width: 100%; height: 100%; }

        #scroll-container { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 200px; }

        header {
            padding: calc(env(safe-area-inset-top) + 20px) 16px 12px;
            display: flex; justify-content: space-between; align-items: flex-end;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100;
        }
        header h1 { font-size: 34px; margin: 0; font-weight: 700; letter-spacing: -1.2px; }
        .header-sub { font-size: 15px; color: #98989d; font-weight: 600; margin-top: 2px; }

        /* 相簿網格 */
        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 2px; }

        .grid-item { aspect-ratio: 1/1; position: relative; overflow: hidden; background: #1c1c1e; cursor: pointer; }
        .grid-item:active { filter: brightness(0.7); }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; }

        /* 星座卡片元件 (縮圖與點開完全共用樣式) */
        .zodiac-photo {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            padding: 30px 20px; justify-content: space-between; text-align: left;
            position: relative;
        }
        .zp-header { font-size: 28px; font-weight: 800; margin-bottom: 5px; }
        .zp-date { font-size: 14px; opacity: 0.7; margin-bottom: 25px; display: block; letter-spacing: 1px; }
        .zp-body { font-size: 16px; line-height: 1.6; opacity: 0.95; font-weight: 400; }
        .zp-footer { border-top: 0.5px solid rgba(255,255,255,0.3); padding-top: 20px; margin-top: 30px; }
        .zp-lucky-label { font-size: 12px; opacity: 0.6; display: block; margin-bottom: 12px; letter-spacing: 1px; font-weight: 700; }
        .zp-nums { display: flex; justify-content: space-between; font-size: 22px; font-weight: 700; }

        /* 全螢幕檢視器 */
        #viewer { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; }
        #viewer.active { display: flex; animation: iosPop 0.4s var(--ios-ease) forwards; }

        @keyframes iosPop {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .v-nav { padding: calc(env(safe-area-inset-top) + 15px) 16px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { color: var(--ios-blue); font-size: 18px; font-weight: 500; display: flex; align-items: center; }
        .back-btn::before { content: "〈 "; font-weight: 700; }

        .v-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
        #v-content { width: 100%; height: auto; aspect-ratio: 3/4; display: flex; justify-content: center; align-items: center; overflow: hidden; border-radius: 0px;}

        /* 底部工具列與 Dock */
        .v-toolbar { padding: 20px 40px calc(env(safe-area-inset-bottom) + 10px); display: flex; justify-content: space-between; color: var(--ios-blue); font-size: 24px; opacity: 0.9; }
        .dock-container { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 20px); left: 0; width: 100%; display: flex; justify-content: center; z-index: 1000; pointer-events: none; }
        .dock-capsule { pointer-events: auto; background: var(--dock-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); height: 64px; border-radius: 32px; display: flex; align-items: center; padding: 0 10px; border: 0.5px solid rgba(255,255,255,0.1); box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .dock-btn { display: flex; align-items: center; padding: 0 20px; height: 50px; border-radius: 25px; color: #fff; text-decoration: none; font-size: 14px; font-weight: 600; }
        .dock-btn.active { background: rgba(255, 255, 255, 0.15); color: var(--ios-blue); }
    </style>
</head>
<body>

    <div id="scroll-container">
        <header>
            <div><h1>圖庫</h1><div class="header-sub">36 個項目</div></div>
            <div style="background:#2c2c2e; padding:8px 16px; border-radius:22px; font-size:15px; font-weight:600;">選取</div>
        </header>
        <main class="photo-grid" id="gallery"></main>
    </div>

    <div id="viewer">
        <div class="v-nav"><div class="back-btn" onclick="closeViewer()">圖庫</div><div style="font-weight:600">編輯</div><div style="color:var(--ios-blue)">⋯</div></div>
        <div class="v-body" onclick="closeViewer()"><div id="v-content"></div></div>
        <div class="v-toolbar"><span>📤</span><span>❤️</span><span>ℹ️</span><span>🗑️</span></div>
    </div>

    <div class="dock-container"><div class="dock-capsule"><a href="#" class="dock-btn active"><span>圖庫</span></a><a href="#" class="dock-btn"><span>選集</span></a></div></div>

    <script>
        // 1. 24張基礎照片
        const basePhotos = Array.from({ length: 24 }, (_, i) => ({ type: 'img', src: `https://picsum.photos/1000/1000?random=${i + 1}` }));

        // 2. 12星座數據 (精確加總邏輯)
        const zodiacs = [
            { name: "摩羯座", date: "12/22-1/19", bg: "#243B55", nums: [12, 45, 38, 76, 30], desc: "您擁有無與倫比的耐力，是天生的長跑選手。在事業上總能默默耕耘並在最後達成成就。" },
            { name: "水瓶座", date: "1/20-2/18", bg: "#141E30", nums: [24, 51, 63, 19, 45], desc: "獨特且充滿智慧的靈魂。創新是您的代名詞，這讓您在群體中總是閃耀異於常人的光芒。" },
            { name: "雙魚座", date: "2/19-3/20", bg: "#2C3E50", nums: [33, 42, 57, 28, 43], desc: "情感豐富且具備強大直覺。您是藝術與浪漫的化身，能感知微細變化。今日能量將強化感應。" },
            { name: "牡羊座", date: "3/21-4/19", bg: "#4B1248", nums: [15, 66, 31, 48, 44], desc: "熱情勇敢且充滿行動力。您不畏懼未知挑戰，開創精神讓您領先群倫。今日勇敢說出您的計畫。" },
            { name: "金牛座", date: "4/20-5/20", bg: "#0F2027", nums: [28, 39, 55, 17, 66], desc: "對美與物質有極高敏銳度，追求質感與安定。您的固執往往是成功的關鍵，代表對目標忠誠。" },
            { name: "雙子座", date: "5/21-6/21", bg: "#373B44", nums: [41, 22, 68, 35, 40], desc: "機智善變且充滿好奇心。您擁有雙倍活力與溝通技巧。今日會有意想不到的訊息傳來開啟冒險。" },
            { name: "巨蟹座", date: "6/22-7/22", bg: "#16222A", nums: [19, 73, 24, 56, 35], desc: "溫柔體貼且重視家庭歸屬。您的防備心源於愛，一旦認定對方，將展現守護力量。享受寧靜。" },
            { name: "獅子座", date: "7/23-8/22", bg: "#42275A", nums: [52, 31, 44, 18, 63], desc: "天生王者，充滿自信且具魅力。您喜歡成為焦點，並引領他人。今日您的創造力爆發擋不住。" },
            { name: "處女座", date: "8/23-9/22", bg: "#1D2671", nums: [37, 49, 25, 62, 36], desc: "追求完美注重細節，是最高效率執行者。清醒邏輯讓您無可替代。微小改變將帶來幸運效應。" },
            { name: "天蠍座", date: "10/24-11/22", bg: "#000000", nums: [44, 28, 71, 15, 52], desc: "神秘深沈且擁有洞察力。您從不妥寫，對於熱愛事物有著靈魂執著。今日能量將引導您發掘真相。" },
            { name: "天瓶座", date: "9/23-10/23", bg: "#200122", nums: [65, 22, 39, 47, 38], desc: "優雅公正且追求和諧。您擅長平衡衝突，社交不可或缺。今日美感將協助您做出最完美的決定。" },
            { name: "射手座", date: "11/23-12/21", bg: "#0F0C29", nums: [21, 55, 68, 34, 34], desc: "愛好自由樂觀冒險。心中裝著星辰大海，追求智慧與真理。適合規劃一場說走就走的旅行。" }
        ].map(z => ({ ...z, type: 'card' }));

        const fullData = [...basePhotos, ...zodiacs];
        const gallery = document.getElementById('gallery');

        // 生成卡片樣式 (一致化模板)
        function createZodiacHTML(item) {
            return `
                <div class="zodiac-photo" style="background:${item.bg};">
                    <div>
                        <div class="zp-header">${item.name}</div>
                        <span class="zp-date">${item.date}</span>
                        <div class="zp-body">${item.desc}</div>
                    </div>
                    <div class="zp-footer">
                        <span class="zp-lucky-label">LUCKY NUMBERS</span>
                        <div class="zp-nums">
                            ${item.nums.map(n => `<span>${n}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        fullData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'grid-item';
            if (item.type === 'img') {
                div.innerHTML = `<img class="thumb-img" src="${item.src}" loading="lazy">`;
            } else {
                // 網格中的卡片：固定 1:1，但內容容器會被裁切底部
                div.innerHTML = createZodiacHTML(item);
            }
            div.onclick = () => openViewer(item);
            gallery.appendChild(div);
        });

        const viewer = document.getElementById('viewer');
        const vContent = document.getElementById('v-content');

        function openViewer(item) {
            if (item.type === 'img') {
                vContent.style.aspectRatio = '1/1';
                vContent.innerHTML = `<img style="width:100%; height:100%; object-fit:contain;" src="${item.src}">`;
            } else {
                // 點開後的卡片：展開為 3:4 比例顯示完整內容
                vContent.style.aspectRatio = '3/4';
                vContent.innerHTML = createZodiacHTML(item);
            }
            viewer.style.display = 'flex';
            setTimeout(() => viewer.classList.add('active'), 10);
        }

        function closeViewer() {
            viewer.classList.remove('active');
            setTimeout(() => viewer.style.display = 'none', 400);
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    </script>
</body>
</html>
