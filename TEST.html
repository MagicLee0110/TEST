<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="照片">
    <title>照片</title>
    <style>
        :root {
            --ios-gray: #1c1c1e;
            --ios-blue: #0a84ff;
            --text-main: #ffffff;
            --text-sec: #8e8e93;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background-color: #000;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", sans-serif;
            padding-top: env(safe-area-inset-top);
            padding-bottom: 150px;
        }

        /* 頂部導覽列 */
        header {
            padding: 20px 16px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-left h1 {
            font-size: 34px;
            margin: 0;
            font-weight: 700;
        }

        .header-left span {
            font-size: 15px;
            color: var(--text-sec);
            font-weight: 600;
            display: block;
            margin-top: -2px;
        }

        .header-right {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .circle-btn {
            background: #2c2c2e;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .select-btn {
            background: #2c2c2e;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }

        /* 相簿網格 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            margin-top: 10px;
        }

        .photo-item {
            aspect-ratio: 1 / 1;
            background-color: #1c1c1e;
            overflow: hidden;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* iOS 18 懸浮膠囊控制列 */
        .floating-dock-container {
            position: fixed;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .dock-capsule {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            border: 0.5px solid rgba(255,255,255,0.1);
            width: 85%;
            max-width: 350px;
        }

        .dock-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 48px;
            border-radius: 30px;
            color: var(--text-sec);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .dock-item.active {
            background: #3a3a3c;
            color: #6fb6ff; /* iOS 18 亮藍色 */
        }

        .dock-icon {
            font-size: 20px;
        }

        .search-circle {
            width: 44px;
            height: 44px;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 10px;
            border: 0.5px solid rgba(255,255,255,0.1);
        }

    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <h1>圖庫</h1>
            <span>150 個項目</span>
        </div>
        <div class="header-right">
            <div class="circle-btn">☰</div>
            <div class="select-btn">選取</div>
        </div>
    </header>

    <div class="photo-grid" id="gallery">
        </div>

    <div class="floating-dock-container">
        <div class="dock-capsule">
            <a href="#" class="dock-item active">
                <span class="dock-icon">🖼️</span>
                <span>圖庫</span>
            </a>
            <a href="#" class="dock-item">
                <span class="dock-icon">🗂️</span>
                <span>選集</span>
            </a>
        </div>
        <div class="search-circle">🔍</div>
    </div>

    <script>
        // 自動生成網格內容
        const gallery = document.getElementById('gallery');
        // 模擬你的截圖內容（筆記、計算機、螢幕截圖等）
        // 建議你將自己的圖片命名為 1.jpg, 2.jpg... 放入同目錄
        for (let i = 1; i <= 24; i++) {
            const item = document.createElement('div');
            item.className = 'photo-item';
            // 這裡先用隨機圖，你可以改成 `src="img/${i}.jpg"`
            item.innerHTML = `<img src="https://picsum.photos/400/400?random=${i+20}" alt="">`;
            gallery.appendChild(item);
        }

        // 禁止長按彈出選單（更有 App 感）
        window.oncontextmenu = function(event) {
            event.preventDefault();
            event.stopPropagation();
            return false;
        };
    </script>
</body>
</html>
