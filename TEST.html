<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>iOS Magic Dark</title>
    <style>
        :root {
            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            --bg-black: #000000;
            --memo-black: #000000;
            /* 漸層：從純黑開始向下延伸至深藍紫，再回到黑 */
            --main-gradient: linear-gradient(180deg, #000000 0%, #1a152e 40%, #000000 100%);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: var(--ios-font);
            overflow: hidden;
            background-color: var(--bg-black);
        }

        /* --- 通知中心畫面 --- */
        #notification-center {
            width: 100%; height: 100%;
            background: var(--main-gradient);
            background-attachment: fixed;
            display: block;
            position: relative;
            color: white;
        }

        .clock-container {
            text-align: center;
            padding-top: calc(env(safe-area-inset-top) + 60px);
        }
        .time-text { font-size: 95px; font-weight: 200; margin: 0; letter-spacing: -2px; }
        .date-text { font-size: 19px; opacity: 0.9; }

        .notification-header { padding: 40px 25px 15px; font-size: 28px; font-weight: 600; }

        /* 通知卡片樣式 */
        .notification-list { padding: 0 15px; }
        .notif-card {
            background: rgba(40, 40, 40, 0.4);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 24px; padding: 15px; margin-bottom: 12px;
            display: flex; flex-direction: column;
        }
        .notif-top { display: flex; gap: 12px; }
        .notif-icon { width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; position: relative; }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: white; color: black; font-size: 10px; font-weight: bold; padding: 2px 4px; border-radius: 10px; }
        .notif-content { flex: 1; }
        .notif-title-row { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; }
        .notif-time { font-weight: 400; opacity: 0.6; font-size: 13px; }
        .notif-body { font-size: 14px; line-height: 1.4; opacity: 0.9; }
        
        .notif-actions { display: flex; gap: 8px; margin-top: 15px; }
        .action-btn { flex: 1; background: rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; text-align: center; font-size: 15px; }

        /* --- 隱形六宮格感應區 --- */
        .magic-grid {
            position: absolute;
            bottom: 50px; left: 0; width: 100%; height: 45%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            z-index: 100;
        }

        /* --- 備忘錄畫面 (深色版) --- */
        #memo-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--memo-black);
            color: #ffffff;
            display: none;
            flex-direction: column;
            z-index: 200;
        }

        .memo-header {
            padding: calc(env(safe-area-inset-top) + 10px) 20px 10px;
            display: flex; justify-content: space-between;
            align-items: center; 
            color: #d4a017; /* 經典備忘錄金黃色 */
            font-size: 17px;
        }

        .handwriting-area {
            flex: 1; padding: 60px 20px;
            /* 備忘錄深色模式下，手寫字體通常為白色 */
            font-family: "Cursive", "Bradley Hand", "Marker Felt", sans-serif;
            font-size: 120px; text-align: center;
            color: #ffffff;
        }

        /* 底部 Home Bar */
        .home-bar {
            position: fixed; bottom: 8px; left: 50%;
            transform: translateX(-50%); width: 140px; height: 5px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px; z-index: 300;
        }
    </style>
</head>
<body>

    <div id="notification-center">
        <div class="clock-container">
            <div class="date-text" id="dateDisplay">1月3日 週六</div>
            <h1 class="time-text" id="timeDisplay">15:02</h1>
        </div>
        <div class="notification-header">通知中心</div>

        <div class="notification-list">
            <div class="notif-card">
                <div class="notif-top">
                    <div class="notif-icon" style="background-color: #ff4500;">S<span class="notif-badge">23</span></div>
                    <div class="notif-content">
                        <div class="notif-title-row"><span>您關注的賣家開始直播了！</span><span class="notif-time">1小時前</span></div>
                        <div class="notif-body">觀看 Yomigirls 的直播：神美浩肯包🤩...</div>
                    </div>
                </div>
            </div>

            <div class="notif-card">
                <div class="notif-top">
                    <div class="notif-icon" style="background-color: #006aa6;">D<span class="notif-badge">19</span></div>
                    <div class="notif-content">
                        <div class="notif-title-row"><span>你追蹤的「理財板」新文章</span><span class="notif-time">2小時前</span></div>
                        <div class="notif-body">「台股瘋了 正二也瘋了」</div>
                    </div>
                </div>
                <div style="text-align:center; font-size: 13px; margin: 15px 0 10px; opacity: 0.8;">要繼續接收「Dcard」App的通知嗎？</div>
                <div class="notif-actions">
                    <div class="action-btn">繼續⋯</div><div class="action-btn">關閉⋯</div>
                </div>
            </div>
            </div>

        <div class="magic-grid">
            <div onclick="openMemo(36)"></div>
            <div onclick="openMemo(45)"></div>
            <div onclick="openMemo(54)"></div>
            <div onclick="openMemo(63)"></div>
            <div onclick="openMemo(72)"></div>
            <div onclick="openMemo(81)"></div>
        </div>
        
        <div class="home-bar"></div>
    </div>

    <div id="memo-screen" onclick="closeMemo()">
        <div class="memo-header">
            <span>＜ 備忘錄</span>
            <span style="font-weight:600;">完成</span>
        </div>
        <div class="handwriting-area" id="handwritingNumber"></div>
        <div class="home-bar"></div>
    </div>

    <script>
        const notifScreen = document.getElementById('notification-center');
        const memoScreen = document.getElementById('memo-screen');
        const numDisplay = document.getElementById('handwritingNumber');

        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hours}:${minutes}`;
            const weekDays = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
            document.getElementById('dateDisplay').textContent = `${now.getMonth() + 1}月${now.getDate()}日 ${weekDays[now.getDay()]} · 乙巳年冬月十五`;
        }

        function openMemo(num) {
            numDisplay.textContent = num;
            notifScreen.style.display = 'none';
            memoScreen.style.display = 'flex';
            // 頂部狀態列在此版本始終保持黑色，無需動態修改 meta
        }

        function closeMemo() {
            memoScreen.style.display = 'none';
            notifScreen.style.display = 'block';
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
