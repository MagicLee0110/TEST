<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>iOS 26 Gallery Pro</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-main: #FFFFFF;
            --text-sub: #8E8E93;
            --accent: #0A84FF;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- Header --- */
        .header {
            padding-top: max(20px, var(--safe-top));
            padding-bottom: 10px; padding-left: 20px; padding-right: 20px;
            display: flex; justify-content: space-between; align-items: flex-end;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            z-index: 100; position: fixed; top: 0; left: 0; right: 0;
        }
        .header-left { display: flex; flex-direction: column; gap: 2px; }
        .title { font-size: 34px; font-weight: 800; letter-spacing: 0.5px; }
        .subtitle { font-size: 14px; font-weight: 600; color: var(--text-sub); }
        .header-right { display: flex; gap: 12px; margin-bottom: 5px; }
        .icon-btn { width: 36px; height: 36px; background: #2C2C2E; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .select-btn { background: #2C2C2E; border-radius: 20px; padding: 8px 16px; font-size: 14px; font-weight: 600; display: flex; align-items: center; }

        /* --- Grid --- */
        .scroll-area { flex: 1; overflow-y: auto; padding-top: calc(80px + var(--safe-top)); padding-bottom: 120px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
        
        .photo { 
            aspect-ratio: 1/1; 
            background: #1c1c1e; /* 預設深灰背景 */
            overflow: hidden; 
            position: relative; 
            cursor: pointer;
        }

        /* 一般照片 (非文字) */
        .photo img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block;
        }

        /* --- 核心修改：純文字照片樣式 (Text Photo) --- */
        /* 這讓 div 看起來像是一張「黑底白字的 JPG」 */
        .photo.text-photo {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000000; /* 純黑底，像照片 */
            color: #ffffff;
            text-align: center;
        }
        
        /* 模擬照片質感：給一點點非常細微的邊框或陰影，讓它不至於跟背景融為一體 */
        .photo.text-photo-inner {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
        }

        .tp-symbol {
            font-size: 48px;
            margin-bottom: 4px;
            line-height: 1;
            /* 讓符號看起來銳利，像印刷品 */
        }
        
        .tp-name {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ccc;
        }

        /* 點擊效果 */
        .photo:active { opacity: 0.8; transition: 0.2s; }


        /* --- Floating Nav --- */
        .floating-dock { position: fixed; bottom: max(20px, var(--safe-bottom)); left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; pointer-events: none; z-index: 200; }
        .nav-capsule { pointer-events: auto; background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-radius: 35px; height: 65px; display: flex; align-items: center; padding: 0 5px; border: 1px solid rgba(255,255,255,0.1); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 70px; height: 100%; color: #888; gap: 4px; }
        .nav-item.active { color: var(--accent); }
        .nav-label { font-size: 10px; font-weight: 600; }
        .search-circle { pointer-events: auto; width: 65px; height: 65px; background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); color: #fff; }

        /* --- Viewer (大圖模式) --- */
        .viewer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 300; display: none; flex-direction: column;
            opacity: 0; transition: opacity 0.2s;
        }
        .viewer.show { opacity: 1; }
        
        .viewer-content {
            flex: 1; display: flex; align-items: center; justify-content: center;
            width: 100%;
        }

        /* 這是給一般照片用的 */
        #viewer-img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            display: none; /* 預設隱藏 */
        }

        /* 這是給星座用的「純文字大圖」 */
        #viewer-text-card {
            display: none; /* 預設隱藏 */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            color: white;
            padding: 40px;
        }
        
        /* 大圖模式下的文字排版 (像海報) */
        .vt-symbol { font-size: 100px; margin-bottom: 20px; font-weight: 300; }
        .vt-title { font-size: 40px; font-weight: 800; margin-bottom: 10px; letter-spacing: 2px; }
        .vt-date { font-size: 18px; color: var(--accent); margin-bottom: 30px; font-weight: 600; letter-spacing: 2px; }
        .vt-desc { font-size: 18px; line-height: 1.6; max-width: 80%; color: #ccc; }

        .viewer-close {
            position: absolute; top: max(20px, var(--safe-top)); left: 20px;
            padding: 10px; color: var(--accent); font-size: 18px; font-weight: 600; z-index: 301;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <div class="title">圖庫</div>
            <div class="subtitle">文字圖庫 & 照片</div>
        </div>
        <div class="header-right">
            <div class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></div>
            <div class="select-btn">選取</div>
        </div>
    </div>

    <div class="scroll-area">
        <div class="grid" id="grid"></div>
    </div>

    <div class="floating-dock">
        <div class="nav-capsule">
            <div class="nav-item active">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12z"/><path d="M8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                <span class="nav-label">圖庫</span>
            </div>
            <div class="nav-item">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm2 4h12v2H6zm-2 4h16v2H4z"/></svg>
                <span class="nav-label">選集</span>
            </div>
        </div>
        <div class="search-circle">
            <svg width="24" height="24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
    </div>

    <div class="viewer" id="viewer" onclick="closeViewer()">
        <div class="viewer-close">完成</div>
        <div class="viewer-content">
            <img id="viewer-img" src="">
            
            <div id="viewer-text-card">
                <div class="vt-symbol" id="vt-symbol"></div>
                <div class="vt-title" id="vt-title"></div>
                <div class="vt-date" id="vt-date"></div>
                <div class="vt-desc" id="vt-desc"></div>
            </div>
        </div>
    </div>

    <script>
        // Data
        const zodiacSigns = [
            { symbol: "♈", name: "牡羊座", date: "3.21 - 4.19", desc: "充滿活力的開創者。\n行動力強，直覺敏銳。" },
            { symbol: "♉", name: "金牛座", date: "4.20 - 5.20", desc: "穩重感性的鑑賞家。\n重視安全感與質感。" },
            { symbol: "♊", name: "雙子座", date: "5.21 - 6.20", desc: "機智多變的溝通者。\n思維敏捷，好奇心旺盛。" },
            { symbol: "♋", name: "巨蟹座", date: "6.21 - 7.22", desc: "溫柔細膩的守護者。\n外剛內柔，極具同理心。" },
            { symbol: "♌", name: "獅子座", date: "7.23 - 8.22", desc: "光芒四射的領導者。\n自信大方，具有王者風範。" },
            { symbol: "♍", name: "處女座", date: "8.23 - 9.22", desc: "追求完美的分析師。\n心思縝密，注重細節。" },
            { symbol: "♎", name: "天秤座", date: "9.23 - 10.22", desc: "優雅和諧的協調者。\n追求公平，擅長平衡。" },
            { symbol: "♏", name: "天蠍座", date: "10.23 - 11.21", desc: "深沈神秘的洞察者。\n愛恨分明，意志力堅強。" },
            { symbol: "♐", name: "射手座", date: "11.22 - 12.21", desc: "自由奔放的哲學家。\n樂觀開朗，嚮往遠方。" },
            { symbol: "♑", name: "摩羯座", date: "12.22 - 1.19", desc: "沈穩堅毅的實踐者。\n務實負責，一步一腳印。" },
            { symbol: "♒", name: "水瓶座", date: "1.20 - 2.18", desc: "獨樹一格的革新者。\n思維跳躍，走在時代尖端。" },
            { symbol: "♓", name: "雙魚座", date: "2.19 - 3.20", desc: "浪漫夢幻的藝術家。\n富有同情心，想像力豐富。" }
        ];
        
        const randomTopics = ["tech", "city", "road", "forest", "dark", "neon"];
        
        const grid = document.getElementById('grid');
        const viewer = document.getElementById('viewer');
        const viewerImg = document.getElementById('viewer-img');
        const viewerText = document.getElementById('viewer-text-card');

        // Render
        let html = '';
        
        // 1. Render Zodiacs as "Text Photos" (純文字照片)
        zodiacSigns.forEach((z, i) => {
            // 這裡不放 img 標籤，而是用 div 做出海報效果
            // 這些 div 就像是一張張已經寫好字的圖片
            html += `
                <div class="photo text-photo" onclick="openZodiacViewer(${i})">
                    <div class="tp-symbol">${z.symbol}</div>
                    <div class="tp-name">${z.name}</div>
                </div>
            `;
        });

        // 2. Render Random Real Photos
        for(let i=0; i<21; i++) {
            const topic = randomTopics[i % randomTopics.length];
            const src = `https://picsum.photos/seed/${topic}${i}More/800/800`;
            html += `<div class="photo" onclick="openPhotoViewer('${src}')"><img src="${src}" loading="lazy"></div>`;
        }
        grid.innerHTML = html;

        // Viewer Logic

        // 打開星座 (顯示純文字海報)
        function openZodiacViewer(index) {
            const data = zodiacSigns[index];
            
            // 隱藏照片元素，顯示文字卡片元素
            viewerImg.style.display = 'none';
            viewerText.style.display = 'flex';

            // 填入資料
            document.getElementById('vt-symbol').innerText = data.symbol;
            document.getElementById('vt-title').innerText = data.name;
            document.getElementById('vt-date').innerText = data.date;
            document.getElementById('vt-desc').innerText = data.desc;
            
            viewer.style.display = 'flex';
            setTimeout(() => viewer.classList.add('show'), 10);
        }

        // 打開普通照片
        function openPhotoViewer(src) {
            // 隱藏文字卡片元素，顯示照片元素
            viewerText.style.display = 'none';
            viewerImg.style.display = 'block';
            
            viewerImg.src = src;
            
            viewer.style.display = 'flex';
            setTimeout(() => viewer.classList.add('show'), 10);
        }

        function closeViewer() {
            viewer.classList.remove('show');
            setTimeout(() => {
                viewer.style.display = 'none';
                viewerImg.src = '';
            }, 200);
        }
    </script>
</body>
</html>
