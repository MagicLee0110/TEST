<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="照片">
    <title>照片</title>
    <style>
        :root {
            --ios-blue: #0a84ff;
            --ios-gray-bg: #1c1c1e;
            --ios-text-sec: #8e8e93;
            --dock-glass: rgba(28, 28, 30, 0.72);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang TC", sans-serif;
        }

        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
            /* 讓內容延伸到狀態欄下方 */
            padding-top: 0; 
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* 頂部導覽列：精確對齊截圖 */
        header {
            padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: rgba(0,0,0,0.8);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left h1 {
            font-size: 34px;
            margin: 0;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .header-left .item-count {
            font-size: 15px;
            color: var(--ios-text-sec);
            font-weight: 600;
            margin-top: -2px;
        }

        .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
            padding-top: 6px;
        }

        /* 圓形選單按鈕 */
        .btn-menu {
            width: 34px;
            height: 34px;
            background: #2c2c2e;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px;
        }
        .btn-menu span {
            width: 14px;
            height: 1.5px;
            background: white;
            border-radius: 1px;
        }

        /* 選取按鈕 */
        .btn-select {
            background: #2c2c2e;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            transition: opacity 0.2s;
        }

        /* 相簿網格 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding-bottom: 200px; /* 為底部控制列留白 */
        }

        .photo-item {
            aspect-ratio: 1/1;
            background: #111;
            overflow: hidden;
            transition: transform 0.1s;
        }

        .photo-item:active {
            transform: scale(0.97);
            filter: brightness(0.8);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* iOS 18 底部控制列組件 */
        .dock-container {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom) + 20px);
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }

        .main-dock {
            pointer-events: auto;
            background: var(--dock-glass);
            backdrop-filter: blur(30px) saturate(210%) brightness(0.8);
            -webkit-backdrop-filter: blur(30px) saturate(210%) brightness(0.8);
            height: 54px;
            border-radius: 27px;
            display: flex;
            align-items: center;
            padding: 0 4px;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .dock-btn {
            display: flex;
            align-items: center;
            padding: 0 16px;
            height: 46px;
            border-radius: 23px;
            color: #fff;
            text-decoration: none;
        }

        .dock-btn.active {
            background: rgba(255, 255, 255, 0.12);
            color: var(--ios-blue);
        }

        .dock-btn span {
            font-size: 13px;
            font-weight: 600;
            margin-left: 8px;
        }

        .search-btn {
            pointer-events: auto;
            width: 54px;
            height: 54px;
            background: var(--dock-glass);
            backdrop-filter: blur(30px) saturate(210%) brightness(0.8);
            -webkit-backdrop-filter: blur(30px) saturate(210%) brightness(0.8);
            border-radius: 50%;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        /* 精確 SVG Icon */
        .svg-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <h1>圖庫</h1>
            <div class="item-count">150 個項目</div>
        </div>
        <div class="header-right">
            <div class="btn-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="btn-select">選取</div>
        </div>
    </header>

    <main class="photo-grid" id="gallery">
        </main>

    <div class="dock-container">
        <div class="main-dock">
            <a href="#" class="dock-btn active">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <rect x="3" y="7" width="13" height="13" rx="2.5" stroke="currentColor" stroke-width="2.2" fill="none"/>
                    <path d="M8 3.5h11A2.5 2.5 0 0121.5 6v11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
                    <circle cx="7" cy="11" r="1" fill="currentColor"/>
                </svg>
                <span>圖庫</span>
            </a>
            <a href="#" class="dock-btn">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="2.2" fill="none"/>
                    <line x1="7" y1="9" x2="17" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="7" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="7" y1="15" x2="13" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>選集</span>
            </a>
        </div>
        <div class="search-btn">
            <svg class="svg-icon" style="width:24px; height:24px;" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2.5" fill="none"/>
                <line x1="16" y1="16" x2="20.5" y2="20.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </div>
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        
        // 生成模擬截圖內容（筆記、計算機、螢幕截圖感）
        for (let i = 0; i < 24; i++) {
            const div = document.createElement('div');
            div.className = 'photo-item';
            // 隨機從 picsum 抓取圖，並加上 gray 濾鏡模擬截圖感
            div.innerHTML = `<img src="https://picsum.photos/500/500?random=${i+50}">`;
            gallery.appendChild(div);
        }

        // 禁止 Safari 預設行為
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        // 魔術師森森專用：點擊圖庫可以觸發特定動畫或邏輯（預留空間）
        document.querySelectorAll('.dock-btn').forEach(btn => {
            btn.onclick = (e) => {
                e.preventDefault();
                document.querySelectorAll('.dock-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            };
        });
    </script>
</body>
</html>
