<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>備忘錄</title>
    <style>
        :root {
            --ios-yellow: #ffb400;
            --ios-bg: #ffffff;
            --ios-gray: #8e8e93;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--ios-bg);
            color: #000;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            /* 防止下拉重新整理 */
            overscroll-behavior-y: contain; 
        }

        .header {
            padding: 45px 15px 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .back-btn {
            color: var(--ios-yellow);
            font-size: 17px;
            display: flex;
            align-items: center;
        }

        .back-btn::before {
            content: "＜";
            font-size: 20px;
            margin-right: 5px;
        }

        .content {
            padding: 0 20px 100px 20px;
        }

        .note-title {
            font-size: 30px;
            font-weight: 700;
            margin: 10px 0 15px 0;
        }

        .intro-text {
            font-size: 17px;
            line-height: 1.45;
            margin-bottom: 25px;
        }

        .animal-item {
            padding: 12px 0;
            border-bottom: 0.5px solid #d1d1d6;
            font-size: 17px;
            display: flex;
        }

        .animal-index {
            width: 45px;
            color: var(--ios-gray);
        }

        /* 核心隱藏機制 */
        #magic-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            z-index: 999;
            opacity: 0; /* 完全透明，觀眾看不見 */
            touch-action: none; /* 禁用瀏覽器原生手勢，完全由 JS 接手 */
        }

        #force-indicator {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="force-indicator">--</div>

    <div id="magic-grid">
        <div data-range="10"></div><div data-range="20"></div><div data-range="30"></div>
        <div data-range="40"></div><div data-range="50"></div><div data-range="60"></div>
        <div data-range="70"></div><div data-range="80"></div><div data-range="90"></div>
    </div>

    <div class="header">
        <div class="back-btn">備忘錄</div>
        <div style="color: var(--ios-yellow); font-weight: 600;">完成</div>
    </div>

    <div class="content">
        <div class="note-title">動物感應清單</div>
        <div class="intro-text">
            以下是我們在這次心靈實驗中會用到的 100 種動物清單。請隨意滑動觀察，這些動物都是隨機排列的。
        </div>
        
        <div id="animal-list"></div>
    </div>

    <script>
        const animalListContainer = document.getElementById('animal-list');
        const indicator = document.getElementById('force-indicator');
        const grid = document.getElementById('magic-grid');

        const rawAnimals = [
            "獅子", "老虎", "大象", "斑馬", "長頸鹿", "河馬", "犀牛", "獵豹", "黑猩猩", "狒狒",
            "袋鼠", "無尾熊", "鴨嘴獸", "鴯鶓", "企鵝", "海豹", "海象", "北極熊", "灰狼", "狐狸",
            "松鼠", "兔子", "梅花鹿", "馴鹿", "駱駝", "羊駝", "水牛", "羚羊", "土撥鼠", "刺蝟",
            "貓頭鷹", "老鷹", "孔雀", "天鵝", "蜂鳥", "鸚鵡", "啄木鳥", "鵜鶘", "火烈鳥", "海鷗",
            "烏龜", "鱷魚", "變色龍", "壁虎", "響尾蛇", "眼鏡蛇", "青蛙", "蟾蜍", "蠑螈", "大鯢",
            "章魚", "水母", "海馬", "魷魚", "龍蝦", "螃蟹", "海星", "珊瑚", "海豚", "鯨魚",
            "鯊魚", "魟魚", "海龜", "抹香鯨", "虎鯨", "金魚", "鯉魚", "熱帶魚", "食人魚", "電鰻",
            "蜜蜂", "蝴蝶", "螢火蟲", "蜻蜓", "螳螂", "蟬", "甲蟲", "螞蟻", "蝸牛", "蜘蛛",
            "蝙蝠", "樹懶", "食蟻獸", "犰狳", "鴨子", "鵝", "火雞", "烏鴉", "麻雀", "鴿子",
            "馬", "驢子", "豬", "牛", "綿羊", "山羊", "貓", "狗", "倉鼠", "鼴鼠"
        ];

        let animals = [...rawAnimals];
        let currentForceNum = 0;
        let isTouching = false;
        let baseRange = 0;
        let startY = 0;
        let sensitivity = 15; // 滑動 15px 數字 +1

        function renderList() {
            let html = '';
            for (let i = 0; i < animals.length; i++) {
                html += `<div class="animal-item">
                            <span class="animal-index">${i + 1}.</span>
                            <span class="animal-name">${animals[i]}</span>
                         </div>`;
            }
            animalListContainer.innerHTML = html;
        }

        // 觸摸開始
        grid.addEventListener('touchstart', (e) => {
            isTouching = true;
            const range = e.target.getAttribute('data-range');
            if (range) {
                baseRange = parseInt(range);
                startY = e.touches[0].clientY;
                currentForceNum = baseRange;
                indicator.innerText = currentForceNum;
                indicator.style.display = 'block';
            }
        }, { passive: false });

        // 滑動中 (核心修正：加入 preventDefault)
        grid.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            e.preventDefault(); // 阻止頁面捲動，確保能捕捉到滑動距離
            
            const currentY = e.touches[0].clientY;
            const diffY = currentY - startY;
            
            if (diffY > 0) { // 往下滑
                let increment = Math.floor(diffY / sensitivity);
                if (increment > 9) increment = 9;
                
                currentForceNum = baseRange + increment;
                indicator.innerText = currentForceNum;
            } else {
                // 如果往上滑，回到 baseRange
                currentForceNum = baseRange;
                indicator.innerText = currentForceNum;
            }
        }, { passive: false });

        // 觸摸結束
        grid.addEventListener('touchend', () => {
            if (!isTouching) return;
            
            if (currentForceNum >= 1 && currentForceNum <= 100) {
                // 更新名單：先重置，再放熊貓
                animals = [...rawAnimals];
                animals[currentForceNum - 1] = "熊貓";
                renderList();
            }

            isTouching = false;
            indicator.style.display = 'none';
        });

        renderList();
    </script>
</body>
</html>
