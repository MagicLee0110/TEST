<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notes</title>
    <style>
        :root {
            --ios-yellow: #ffb100;
            --ios-bg: #ffffff;
            --ios-gray: #8e8e93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ios-bg);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            color: var(--ios-yellow);
            font-size: 17px;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            z-index: 1000;
            border-bottom: 0.5px solid #d1d1d6;
        }

        .back-btn::before { content: "〈 "; font-weight: 600; }

        /* 極淡的數字指示器 */
        #force-indicator {
            position: fixed;
            top: 5px;
            left: 5px;
            font-size: 11px;
            color: rgba(0, 0, 0, 0.08); 
            z-index: 2000;
            display: none;
        }

        /* 秘密觸發九宮格 */
        #trigger-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 200px; /* 覆蓋標題與導覽列區域 */
            z-index: 1500;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .content-wrap { padding: 0 20px 100px 20px; }
        .note-date { color: var(--ios-gray); text-align: center; font-size: 13px; margin: 15px 0; }
        h1 { font-size: 28px; font-weight: 800; margin: 0 0 12px 0; }
        .intro-text { font-size: 17px; line-height: 1.5; margin-bottom: 25px; color: #1c1c1e; }
        .list-container { border-top: 0.5px solid #d1d1d6; }
        .item { display: flex; padding: 12px 0; border-bottom: 0.5px solid #d1d1d6; font-size: 17px; }
        .num-label { width: 45px; color: var(--ios-gray); }
    </style>
</head>
<body>

    <div id="force-indicator">0</div>

    <div class="nav-bar">
        <div class="back-btn">備忘錄</div>
        <div style="color: #333; font-weight: 600;">動物百科</div>
        <div>完成</div>
    </div>

    <div id="trigger-grid">
        <div class="grid-cell" data-start="10"></div>
        <div class="grid-cell" data-start="20"></div>
        <div class="grid-cell" data-start="30"></div>
        <div class="grid-cell" data-start="40"></div>
        <div class="grid-cell" data-start="50"></div>
        <div class="grid-cell" data-start="60"></div>
        <div class="grid-cell" data-start="70"></div>
        <div class="grid-cell" data-start="80"></div>
        <div class="grid-cell" data-start="90"></div>
    </div>

    <div class="content-wrap">
        <div class="note-date">2026年1月2日 晚上9:10</div>
        <h1>世界動物名錄</h1>
        <p class="intro-text">
            這是一份用於記憶練習的清單。包含了 100 種不同的生物，每種生物都有一個唯一的編號，請隨意滑動選擇。
        </p>

        <div id="main-list" class="list-container"></div>
    </div>

    <script>
        const listEl = document.getElementById('main-list');
        const indicatorEl = document.getElementById('force-indicator');
        
        let animals = ["獅子", "老虎", "大象", "長頸鹿", "斑馬", "袋鼠", "無尾熊", "企鵝", "河馬", "犀牛", "猩猩", "猴子", "狐狸", "灰狼", "棕熊", "北極熊", "熊貓", "駱駝", "麋鹿", "羚羊", "海豚", "鯨魚", "鯊魚", "海龜", "章魚", "水母", "龍蝦", "螃蟹", "海星", "海馬", "禿鷹", "老鷹", "貓頭鷹", "鸚鵡", "孔雀", "天鵝", "火烈鳥", "翠鳥", "啄木鳥", "麻雀", "變色龍", "蜥蜴", "烏龜", "鱷魚", "蛇", "青蛙", "蟾蜍", "蠑螈", "蜜蜂", "蝴蝶", "蜻蜓", "螳螂", "蟬", "螞蟻", "蝸牛", "蜘蛛", "蠍子", "蝙蝠", "松鼠", "兔子", "老鼠", "刺蝟", "水豚", "懶猴", "樹懶", "浣熊", "臭鼬", "土撥鼠", "犰狳", "鴨嘴獸", "獵豹", "美洲豹", "雲豹", "雪豹", "黑豹", "鬣狗", "野豬", "馴鹿", "犛牛", "羊駝", "羚牛", "羚羊", "麝牛", "鴨子", "鵝", "火雞", "鵪鶉", "鴿子", "烏鴉", "喜鵲", "海鷗", "鵜鶘", "鸕鶿", "鴕鳥", "鴯鶓", "奇異鳥", "大嘴鳥", "犀鳥", "蜂鳥", "金絲雀"];

        let startY = 0;
        let baseValue = 0;
        let finalForcedNum = 0;
        const sensitivity = 15; // 靈敏度：上滑 15px 數字 +1

        function buildList() {
            listEl.innerHTML = animals.map((a, i) => `
                <div class="item">
                    <div class="num-label">${i + 1}.</div>
                    <div>${a}</div>
                </div>
            `).join('');
        }

        const cells = document.querySelectorAll('.grid-cell');
        cells.forEach(cell => {
            cell.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                baseValue = parseInt(cell.getAttribute('data-start'));
                finalForcedNum = baseValue;
                
                indicatorEl.innerText = finalForcedNum;
                indicatorEl.style.display = 'block';
            }, {passive: false});

            cell.addEventListener('touchmove', (e) => {
                e.preventDefault(); 
                let currentY = e.touches[0].clientY;
                
                // 這裡改為上滑邏輯：起點減掉當前點
                let distance = startY - currentY; 
                let increment = Math.floor(distance / sensitivity);
                
                let tempNum = baseValue + increment;
                if (tempNum < baseValue) tempNum = baseValue;
                if (tempNum > baseValue + 9) tempNum = baseValue + 9;
                
                finalForcedNum = tempNum;
                indicatorEl.innerText = finalForcedNum;
            }, {passive: false});

            cell.addEventListener('touchend', () => {
                applyForce(finalForcedNum);
                indicatorEl.style.display = 'none';
            });
        });

        function applyForce(targetNum) {
            const targetIdx = targetNum - 1;
            const panda = "熊貓";
            const oldIdx = animals.indexOf(panda);

            if (oldIdx !== -1 && oldIdx !== targetIdx) {
                let replacedAnimal = animals[targetIdx];
                animals[targetIdx] = panda;
                animals[oldIdx] = replacedAnimal;
                buildList();
            }
        }

        buildList();
    </script>
</body>
</html>
