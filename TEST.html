<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>照片</title>
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-bg: #f2f2f7;
            --glass: rgba(255, 255, 255, 0.75);
            --radius: 28px; /* 未來的超大圓角 */
        }

        body {
            margin: 0;
            background-color: var(--ios-bg);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        /* 頂部動態標題 */
        header {
            padding: 60px 20px 10px 20px;
            background: linear-gradient(to bottom, rgba(242,242,247,1) 70%, rgba(242,242,247,0));
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--ios-blue);
            font-size: 17px;
            margin-bottom: 8px;
        }

        header h1 {
            font-size: 34px;
            letter-spacing: -1px;
            margin: 0;
            font-weight: 700;
        }

        /* 搜尋框預留 */
        .search-bar {
            background: rgba(118, 118, 128, 0.12);
            border-radius: 12px;
            padding: 8px 12px;
            margin-top: 15px;
            color: #8e8e93;
            font-size: 16px;
            display: flex;
            align-items: center;
        }

        /* 照片網格：iOS 26 更加緊湊且無縫 */
        .grid-container {
            padding: 2px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
        }

        .photo-card {
            aspect-ratio: 1/1;
            position: relative;
            overflow: hidden;
            background: #e5e5ea;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .photo-card:active {
            transform: scale(0.96);
            filter: brightness(0.8);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 懸浮式底部導覽 (Floating Dock) - iOS 26 的核心預測 */
        .floating-nav {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            height: 64px;
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 32px;
            border: 0.5px solid rgba(255,255,255,0.3);
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #636366;
            transition: 0.2s;
        }

        .nav-item.active {
            color: var(--ios-blue);
        }

        .nav-item i {
            font-size: 22px;
            margin-bottom: 2px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 500;
        }

        /* 全螢幕檢視器 */
        #viewer {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            flex-direction: column;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(1.1); } to { opacity: 1; transform: scale(1); } }

        #viewer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .viewer-header {
            position: absolute;
            top: env(safe-area-inset-top);
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            color: white;
            z-index: 2001;
        }

        .viewer-footer {
            position: absolute;
            bottom: env(safe-area-inset-bottom);
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-around;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="top-row">
            <span>＜ 相簿</span>
            <span style="font-weight: 600;">選取</span>
        </div>
        <h1>最近項目</h1>
        <div class="search-bar">
            <span style="margin-right:8px">🔍</span> 搜尋照片、地點...
        </div>
    </header>

    <main class="grid-container" id="gallery">
        </main>

    <nav class="floating-nav">
        <a href="#" class="nav-item">
            <i>🖼️</i><span class="nav-label">圖庫</span>
        </a>
        <a href="#" class="nav-item">
            <i>✨</i><span class="nav-label">為您推薦</span>
        </a>
        <a href="#" class="nav-item active">
            <i>📂</i><span class="nav-label">相簿</span>
        </a>
        <a href="#" class="nav-item">
            <i>🔍</i><span class="nav-label">搜尋</span>
        </a>
    </nav>

    <div id="viewer">
        <div class="viewer-header" onclick="closeViewer()">
            <span>＜ 返回</span>
            <span>⋯</span>
        </div>
        <img id="viewer-img" src="">
        <div class="viewer-footer">
            <span>📤</span>
            <span>❤️</span>
            <span>ℹ️</span>
            <span>🗑️</span>
        </div>
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        
        // 生成 21 張範例照片
        for (let i = 1; i <= 21; i++) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            const imgUrl = `https://picsum.photos/600/600?random=${i}`;
            card.innerHTML = `<img src="${imgUrl}" loading="lazy">`;
            card.onclick = () => openViewer(imgUrl);
            gallery.appendChild(card);
        }

        function openViewer(src) {
            document.getElementById('viewer-img').src = src;
            document.getElementById('viewer').style.display = 'flex';
        }

        function closeViewer() {
            document.getElementById('viewer').style.display = 'none';
        }

        // 禁止雙擊縮放
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) event.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
