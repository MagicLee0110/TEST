<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>備忘錄</title>
    <style>
        :root {
            --ios-yellow: #ffb400;
            --ios-bg: #ffffff;
            --ios-gray: #8e8e93;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--ios-bg);
            color: #000;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        /* iOS 標題工具欄 */
        .header {
            padding: 45px 15px 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .back-btn {
            color: var(--ios-yellow);
            font-size: 17px;
            display: flex;
            align-items: center;
            font-weight: 400;
        }

        .back-btn::before {
            content: "＜";
            font-size: 20px;
            margin-right: 5px;
            font-weight: 600;
        }

        /* 內容區 */
        .content {
            padding: 0 20px 100px 20px;
        }

        .note-title {
            font-size: 30px;
            font-weight: 700;
            margin: 10px 0 15px 0;
        }

        .intro-text {
            font-size: 17px;
            line-height: 1.45;
            margin-bottom: 25px;
            color: #000;
        }

        /* 動物列表樣式 */
        .animal-item {
            padding: 12px 0;
            border-bottom: 0.5px solid #d1d1d6;
            font-size: 17px;
            display: flex;
            align-items: center;
        }

        .animal-index {
            width: 45px;
            color: var(--ios-gray);
            font-variant-numeric: tabular-nums;
        }

        .animal-name {
            color: #000;
        }

        /* 隱藏九宮格 */
        #magic-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            z-index: 999;
            opacity: 0;
        }

        /* 魔術師專用的小型指示器 */
        #force-indicator {
            position: fixed;
            top: 8px;
            left: 8px;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.15); /* 極淡顏色，僅魔術師可見 */
            z-index: 1000;
            display: none;
            pointer-events: none;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="force-indicator">--</div>

    <div id="magic-grid">
        <div data-range="10"></div><div data-range="20"></div><div data-range="30"></div>
        <div data-range="40"></div><div data-range="50"></div><div data-range="60"></div>
        <div data-range="70"></div><div data-range="80"></div><div data-range="90"></div>
    </div>

    <div class="header">
        <div class="back-btn">備忘錄</div>
        <div style="color: var(--ios-yellow); font-weight: 600;">完成</div>
    </div>

    <div class="content">
        <div class="note-title">動物感應清單</div>
        <div class="intro-text">
            這是一份由 AI 隨機生成的動物數據庫，包含世界各地不同環境下的生物。請在心中隨意挑選一個數字，我們將透過數字對應的動物進行心靈連結。
        </div>
        
        <div id="animal-list">
            </div>
    </div>

    <script>
        const animalListContainer = document.getElementById('animal-list');
        const indicator = document.getElementById('force-indicator');
        const grid = document.getElementById('magic-grid');

        // 真實感動物清單
        const rawAnimals = [
            "獅子", "老虎", "大象", "斑馬", "長頸鹿", "河馬", "犀牛", "獵豹", "黑猩猩", "狒狒",
            "袋鼠", "無尾熊", "鴨嘴獸", "鴯鶓", "企鵝", "海豹", "海象", "北極熊", "灰狼", "狐狸",
            "松鼠", "兔子", "梅花鹿", "馴鹿", "駱駝", "羊駝", "水牛", "羚羊", "土撥鼠", "刺蝟",
            "貓頭鷹", "老鷹", "孔雀", "天鵝", "蜂鳥", "鸚鵡", "啄木鳥", "鵜鶘", "火烈鳥", "海鷗",
            "烏龜", "鱷魚", "變色龍", "壁虎", "響尾蛇", "眼鏡蛇", "青蛙", "蟾蜍", "蠑螈", "大鯢",
            "章魚", "水母", "海馬", "魷魚", "龍蝦", "螃蟹", "海星", "珊瑚", "海豚", "鯨魚",
            "鯊魚", "魟魚", "海龜", "抹香鯨", "虎鯨", "金魚", "鯉魚", "熱帶魚", "食人魚", "電鰻",
            "蜜蜂", "蝴蝶", "螢火蟲", "蜻蜓", "螳螂", "蟬", "甲蟲", "螞蟻", "蝸牛", "蜘蛛",
            "蝙蝠", "樹懶", "食蟻獸", "犰狳", "鴨子", "鵝", "火雞", "烏鴉", "麻雀", "鴿子",
            "馬", "驢子", "豬", "牛", "綿羊", "山羊", "貓", "狗", "倉鼠", "鼴鼠"
        ];

        let animals = [...rawAnimals];
        let currentForceNum = 0;
        let isTouching = false;
        let baseRange = 0;
        let startY = 0;
        let sensitivity = 20; // 數字跳動靈敏度：每滑動 20px 數字 +1

        function renderList() {
            animalListContainer.innerHTML = '';
            animals.forEach((name, index) => {
                const item = document.createElement('div');
                item.className = 'animal-item';
                item.innerHTML = `
                    <span class="animal-index">${index + 1}.</span>
                    <span class="animal-name">${name}</span>
                `;
                animalListContainer.appendChild(item);
            });
        }

        // 監聽九宮格觸發
        grid.addEventListener('touchstart', (e) => {
            isTouching = true;
            const range = e.target.getAttribute('data-range');
            if (range) {
                baseRange = parseInt(range);
                startY = e.touches[0].clientY;
                currentForceNum = baseRange;
                indicator.innerText = currentForceNum;
                indicator.style.display = 'block';
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            
            const currentY = e.touches[0].clientY;
            const diffY = currentY - startY; // 下滑值為正
            
            if (diffY > 0) {
                let increment = Math.floor(diffY / sensitivity);
                if (increment > 9) increment = 9; // 限制在該十位數區間內
                
                currentForceNum = baseRange + increment;
                indicator.innerText = currentForceNum;
            }
        }, { passive: true });

        window.addEventListener('touchend', () => {
            if (!isTouching) return;
            
            if (currentForceNum >= 1 && currentForceNum <= 100) {
                // 重置名單，確保只有一個熊貓
                animals = [...rawAnimals];
                // 強迫轉換目標
                animals[currentForceNum - 1] = "熊貓";
                renderList();
            }

            isTouching = false;
            indicator.style.display = 'none';
        });

        // 初始渲染
        renderList();
    </script>
</body>
</html>
