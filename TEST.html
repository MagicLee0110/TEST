<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notes</title>
    <style>
        :root {
            --ios-yellow: #ffb100;
            --ios-bg: #ffffff;
            --ios-gray: #8e8e93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ios-bg);
            margin: 0; padding: 0;
            overflow-y: scroll; /* 允許捲動 */
            user-select: none; -webkit-user-select: none;
        }

        .nav-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; color: var(--ios-yellow); font-size: 17px;
            position: sticky; top: 0; background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px); z-index: 4000; border-bottom: 0.5px solid #d1d1d6;
        }

        #force-indicator {
            position: fixed; top: 60px; left: 8px; font-size: 10px;
            color: rgba(0, 0, 0, 0.1); z-index: 5000; pointer-events: none; display: none;
        }

        /* 秘密感應區：只佔據左右邊緣，中間留空讓觀眾捲動 */
        .secret-zone {
            position: fixed;
            z-index: 3500;
            background: rgba(255, 0, 0, 0); /* 測試時可改 0.05 觀察位置 */
            touch-action: none; /* 阻斷捲動，專心增減數字 */
        }

        /* 0-9 區 (最上方) */
        #zone-top { top: 50px; left: 0; width: 100%; height: 60px; }

        /* 左側感應柱 (10, 40, 70) */
        #zone-left { top: 110px; left: 0; width: 20%; height: 80vh; display: flex; flex-direction: column; }
        
        /* 右側感應柱 (30, 60, 90) */
        #zone-right { top: 110px; right: 0; width: 20%; height: 80vh; display: flex; flex-direction: column; }

        /* 20, 50, 80 區可以藏在左柱和右柱的交界處，或是你習慣的位置 */
        .cell { flex: 1; }

        .content-wrap { padding: 0 20px 100px 20px; position: relative; z-index: 1000; }
        .note-date { color: var(--ios-gray); text-align: center; font-size: 13px; margin: 15px 0; }
        h1 { font-size: 28px; font-weight: 800; margin: 0 0 12px 0; }
        .item { display: flex; padding: 12px 0; border-bottom: 0.5px solid #d1d1d6; font-size: 17px; }
        .num-label { width: 45px; color: var(--ios-gray); }
    </style>
</head>
<body>

    <div id="force-indicator">0</div>

    <div class="nav-bar">
        <div class="back-btn">〈 備忘錄</div>
        <div style="color: #333; font-weight: 600;">清單</div>
        <div>完成</div>
    </div>

    <div id="zone-top" class="secret-zone cell-btn" data-start="0"></div>

    <div id="zone-left" class="secret-zone">
        <div class="cell cell-btn" data-start="10"></div>
        <div class="cell cell-btn" data-start="40"></div>
        <div class="cell cell-btn" data-start="70"></div>
    </div>

    <div id="zone-right" class="secret-zone">
        <div class="cell cell-btn" data-start="30"></div>
        <div class="cell cell-btn" data-start="60"></div>
        <div class="cell cell-btn" data-start="90"></div>
    </div>

    <div class="content-wrap">
        <div class="note-date">2026年1月2日 21:42</div>
        <h1>100種動物研究清單</h1>
        <p>這是一份用於心靈感應實驗的專用清單。請隨意捲動瀏覽。</p>
        <div id="main-list"></div>
    </div>

    <script>
        const listEl = document.getElementById('main-list');
        const indicatorEl = document.getElementById('force-indicator');
        let animals = ["非洲獅", "孟加拉虎", "亞洲象", "網紋長頸鹿", "平原斑馬", "紅袋鼠", "無尾熊", "皇帝企鵝", "河馬", "白犀牛", "山地大猩猩", "松鼠猴", "赤狐", "北極狼", "灰熊", "北極熊", "熊貓", "單峰駱駝", "加拿大馬鹿", "黑尾牛羚", "瓶鼻海豚", "藍鯨", "大白鯊", "綠蠵龜", "大王具足蟲", "月亮水母", "澳洲龍蝦", "大閘蟹", "紅海星", "大肚海馬", "安地斯神鷹", "白頭海鵰", "倉鴞", "金剛鸚鵡", "藍孔雀", "疣鼻天鵝", "美洲紅鸛", "普通翠鳥", "五色鳥", "麻雀", "高冠變色龍", "科摩多龍", "象龜", "尼羅鱷", "眼鏡蛇", "紅眼樹蛙", "大蟾蜍", "雲南蠑螈", "義大利蜂", "大樺斑蝶", "薄翅蜻蜓", "非洲綠螳螂", "熊蟬", "紅火蟻", "非洲大蝸牛", "白額高腳蛛", "帝王蠍", "小狐蝠", "赤腹松鼠", "荷蘭垂耳兔", "溝鼠", "非洲刺蝟", "水豚", "蜂猴", "三趾樹懶", "北美浣熊", "臭鼬", "黑尾土撥鼠", "九帶犰狳", "鴨嘴獸", "印度獵豹", "美洲豹", "雲豹", "雪豹", "黑豹", "斑點鬣狗", "野豬", "馴鹿", "犛牛", "羊駝", "羚牛", "劍羚", "麝牛", "綠頭鴨", "灰雁", "七面鳥", "鵪鶉", "原鴿", "小嘴烏鴉", "喜鵲", "黑脊鷗", "澳洲鵜鶘", "鸕鶿", "非洲鴕鳥", "鴯鶓", "幾維鳥", "大嘴鳥", "犀鳥", "蜂鳥", "蝙蝠"];

        function buildList() {
            listEl.innerHTML = animals.map((a, i) => `
                <div class="item" id="item-${i}">
                    <div class="num-label">${i + 1}.</div>
                    <div class="name-label">${a}</div>
                </div>
            `).join('');
        }

        let startY = 0, baseValue = 0, finalForcedNum = 0;
        const sensitivity = 15;

        document.querySelectorAll('.cell-btn').forEach(cell => {
            cell.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                baseValue = parseInt(cell.getAttribute('data-start'));
                finalForcedNum = (baseValue === 0) ? 1 : baseValue;
                indicatorEl.innerText = finalForcedNum;
                indicatorEl.style.display = 'block';
            });

            cell.addEventListener('touchmove', (e) => {
                let currentY = e.touches[0].clientY;
                let increment = Math.floor((startY - currentY) / sensitivity);
                let tempNum = baseValue + increment;
                
                if (baseValue === 0) {
                    tempNum = Math.max(1, Math.min(9, tempNum));
                } else {
                    tempNum = Math.max(baseValue, Math.min(baseValue + 9, tempNum));
                }
                
                finalForcedNum = tempNum;
                indicatorEl.innerText = finalForcedNum;
            });

            cell.addEventListener('touchend', () => {
                applyForce(finalForcedNum);
                indicatorEl.style.display = 'none';
            });
        });

        function applyForce(targetNum) {
            const targetIdx = targetNum - 1;
            const panda = "熊貓";
            const oldIdx = animals.indexOf(panda);
            if (oldIdx !== -1 && oldIdx !== targetIdx) {
                let replacedAnimal = animals[targetIdx];
                animals[targetIdx] = panda;
                animals[oldIdx] = replacedAnimal;
                document.querySelector(`#item-${targetIdx} .name-label`).innerText = panda;
                document.querySelector(`#item-${oldIdx} .name-label`).innerText = replacedAnimal;
            }
        }

        buildList();
    </script>
</body>
</html>
