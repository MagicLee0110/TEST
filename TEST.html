<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Style Gallery</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        /* 相簿網格容器 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 一排三個，模擬 iOS 資料夾或相簿 */
            gap: 10px; /* 照片之間的間距 */
            max-width: 500px;
            margin: 0 auto;
        }

        /* 每一個照片/方塊的樣式 */
        .photo-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1; /* 保持正方形 */
            background-color: #333; /* 預設背景色 */
            border-radius: 12px; /* iOS 風格圓角 */
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
            
            /* 讓文字置中的關鍵 CSS */
            display: flex;
            justify-content: center; /* 水平置中 */
            align-items: center;     /* 垂直置中 */
            text-align: center;
            font-size: 18px;         /* 文字大小 */
            font-weight: bold;       /* 粗體 */
            color: #fff;             /* 文字顏色 */
            text-shadow: 0 1px 3px rgba(0,0,0,0.5); /* 讓文字在淺色背景也能看清 */
        }

        /* 點擊時的縮放效果 */
        .photo-item:active {
            transform: scale(0.95);
        }

        /* 替 12 星座加上一點漸層背景，讓它看起來不像壞掉的圖片 */
        .zodiac {
            background: linear-gradient(135deg, #4c669f, #3b5998, #192f6a);
        }
        
        /* 一般照片的樣式 (如果您前面的20張是照片，依然保留這個樣式) */
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 如果照片上也要壓文字，可以使用這個容器 (目前星座部分直接寫在 div 裡) */
        .overlay-text {
            pointer-events: none; /* 讓點擊穿透文字 */
        }

    </style>
</head>
<body>

    <div class="gallery-grid">
        
        <div class="photo-item zodiac" onclick="openApp('牡羊座')">牡羊座</div>
        <div class="photo-item zodiac" onclick="openApp('金牛座')">金牛座</div>
        <div class="photo-item zodiac" onclick="openApp('雙子座')">雙子座</div>
        <div class="photo-item zodiac" onclick="openApp('巨蟹座')">巨蟹座</div>
        <div class="photo-item zodiac" onclick="openApp('獅子座')">獅子座</div>
        <div class="photo-item zodiac" onclick="openApp('處女座')">處女座</div>
        <div class="photo-item zodiac" onclick="openApp('天秤座')">天秤座</div>
        <div class="photo-item zodiac" onclick="openApp('天蠍座')">天蠍座</div>
        <div class="photo-item zodiac" onclick="openApp('射手座')">射手座</div>
        <div class="photo-item zodiac" onclick="openApp('魔羯座')">魔羯座</div>
        <div class="photo-item zodiac" onclick="openApp('水瓶座')">水瓶座</div>
        <div class="photo-item zodiac" onclick="openApp('雙魚座')">雙魚座</div>

    </div>

    <script>
        // 簡單的點擊測試，您之後可以換成展開動畫
        function openApp(name) {
            console.log("點擊了：" + name);
            // 這裡之後可以串接您想要像 iOS 一樣展開的動畫邏輯
        }
    </script>

</body>
</html>
