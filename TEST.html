<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS 模擬控制中心</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.1);
            --active-blue: #007AFF;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            background-color: #000;
        }

        /* 模擬桌面背景 */
        .iphone-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070&auto=format&fit=crop') center/cover;
            transition: transform 0.3s ease;
        }

        /* 控制中心遮罩層 */
        .control-center-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            color: white;
            z-index: 100;
        }

        /* 頂部狀態列 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 0 5px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
        }

        /* 網格佈局 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 15px;
            margin-bottom: 15px;
        }

        .card {
            background: var(--glass-bg);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
        }

        /* 連線區塊 */
        .connectivity {
            height: 140px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        .icon-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .icon-circle.active { background: var(--active-blue); }
        .icon-circle.green { background: #4CD964; }
        .icon-circle.orange { background: #FF9500; }

        /* 播放器 */
        .music-player {
            height: 140px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .music-player span { font-size: 14px; color: rgba(255,255,255,0.6); }

        /* 圓形小按鈕 (旋轉鎖定/螢幕鏡像) */
        .small-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-gap: 15px;
        }

        .small-card {
            background: var(--glass-bg);
            border-radius: 20px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 專注模式 */
        .focus-mode {
            grid-column: span 2;
            background: var(--glass-bg);
            border-radius: 20px;
            height: 50px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-weight: 500;
        }

        /* 滑動條區塊 (亮度/音量) */
        .sliders-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-gap: 15px;
            height: 150px;
        }

        .slider-wrapper {
            background: var(--glass-bg);
            border-radius: 25px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
        }

        .slider-fill {
            background: white;
            width: 100%;
            height: 60%; /* 模擬數值 */
        }

        .slider-icon {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            color: #888;
            font-size: 20px;
            mix-blend-mode: difference;
        }

        /* 底部圓形按鈕 */
        .bottom-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 15px;
            margin-top: 15px;
        }

        .round-btn {
            background: var(--glass-bg);
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto;
        }

        /* 關閉按鈕模擬 (點擊空白處關閉) */
        .close-trigger {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="iphone-screen" id="homeScreen">
        </div>

    <div class="control-center-overlay" id="controlCenter">
        <div class="close-trigger" onclick="toggleCC()"></div>

        <div class="header">
            <div style="font-size: 24px;">+</div>
            <div style="font-size: 24px;">⏻</div>
        </div>

        <div class="status-bar">
            <span>無 SIM 卡 🌐</span>
            <span>93% 🔋</span>
        </div>

        <div class="grid-container">
            <div class="card connectivity">
                <div class="icon-circle">✈️</div>
                <div class="icon-circle active">📡</div>
                <div class="icon-circle active">📶</div>
                <div class="icon-circle active">🌐</div>
            </div>
            <div class="card music-player">
                <div style="font-size: 30px; margin-bottom: 5px;">🎵</div>
                <span>未在播放</span>
                <div style="margin-top: 10px; font-size: 20px;">⏮️ ⏸️ ⏭️</div>
            </div>
        </div>

        <div class="grid-container">
            <div class="small-controls">
                <div class="small-card">🔓</div>
                <div class="small-card">📺</div>
            </div>
            <div class="sliders-container">
                <div class="slider-wrapper">
                    <div class="slider-fill" style="height: 70%;"></div>
                    <div class="slider-icon">☀️</div>
                </div>
                <div class="slider-wrapper">
                    <div class="slider-fill" style="height: 40%;"></div>
                    <div class="slider-icon">🔊</div>
                </div>
            </div>
        </div>

        <div class="focus-mode">
            🌙 專注模式 <span style="margin-left: auto;">↕️</span>
        </div>

        <div class="grid-container" style="margin-top:15px;">
            <div class="card" style="height: 140px; flex-direction: column; justify-content: center; align-items: center;">
                <div style="font-size: 40px;">🏠</div>
                <div style="font-size: 12px; margin-top: 10px; color: rgba(255,255,255,0.6);">尚未設定家庭</div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; grid-gap: 15px;">
                <div class="round-btn">🔦</div>
                <div class="round-btn">⏱️</div>
                <div class="round-btn">🔢</div>
                <div class="round-btn">📷</div>
            </div>
        </div>

        <div class="round-btn" style="margin: 20px 0 0 0; width: 50px; height: 50px; font-size: 18px;">🏁</div>
    </div>

    <script>
        function toggleCC() {
            const cc = document.getElementById('controlCenter');
            cc.style.display = cc.style.display === 'none' ? 'flex' : 'none';
        }

        // 模擬點擊背景可以回到桌面
        document.getElementById('homeScreen').addEventListener('click', () => {
            document.getElementById('controlCenter').style.display = 'flex';
        });
    </script>
</body>
</html>
