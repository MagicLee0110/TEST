<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>備忘錄</title>
    <style>
        :root {
            --ios-yellow: #ffb900;
            --ios-bg: #f2f2f7;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: white;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 導覽列 */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: white;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-button {
            color: var(--ios-yellow);
            font-size: 17px;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .done-button {
            color: var(--ios-yellow);
            font-weight: 600;
            font-size: 17px;
        }

        /* 內容區 */
        .content {
            padding: 0 20px 100px 20px;
        }

        .note-date {
            color: #8e8e93;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
        }

        .intro-text {
            font-size: 17px;
            line-height: 1.5;
            margin-bottom: 30px;
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 15px;
        }

        .animal-item {
            font-size: 17px;
            padding: 8px 0;
            border-bottom: 0.5px solid #eee;
            display: flex;
        }

        .animal-num {
            width: 40px;
            color: #8e8e93;
        }

        /* 隱藏的提示數字 (左上角) */
        #secret-counter {
            position: fixed;
            top: 15px;
            left: 50px;
            font-size: 12px;
            color: rgba(0,0,0,0.1); /* 非常淡，只有表演者看得到 */
            z-index: 200;
            pointer-events: none;
            font-weight: bold;
        }

        /* 隱藏的九宮格感應區 */
        .grid-container {
            position: fixed;
            bottom: 50px;
            left: 5%;
            width: 90%;
            height: 300px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            z-index: 150;
            opacity: 0; /* 完全透明 */
        }

        .grid-cell {
            border: 1px solid rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div id="secret-counter"></div>

    <div class="nav-bar">
        <div class="back-button">〈 備忘錄</div>
        <div class="done-button">完成</div>
    </div>

    <div class="content">
        <div class="note-date">2026年1月3日 10:30</div>
        
        <div class="intro-text">
            <strong>【世界動物百科】</strong><br>
            動物界是生物的一界。動物是多細胞真核生命體，能夠主動運動，以有機物為食。以下是本次研究選出的 100 種代表性動物清單：
        </div>

        <div id="animal-list">
            </div>
    </div>

    <div class="grid-container" id="grid">
        <div class="grid-cell" data-range="10"></div>
        <div class="grid-cell" data-range="20"></div>
        <div class="grid-cell" data-range="30"></div>
        <div class="grid-cell" data-range="40"></div>
        <div class="grid-cell" data-range="50"></div>
        <div class="grid-cell" data-range="60"></div>
        <div class="grid-cell" data-range="70"></div>
        <div class="grid-cell" data-range="80"></div>
        <div class="grid-cell" data-range="90"></div>
    </div>

    <script>
        const animalNames = [
            "獅子", "老虎", "大象", "長頸鹿", "斑馬", "河馬", "犀牛", "獵豹", "大猩猩", "黑猩猩",
            "袋鼠", "無尾熊", "企鵝", "北極熊", "棕熊", "狐狸", "灰狼", "浣熊", "水豚", "懶猴",
            "樹懶", "食蟻獸", "犰狳", "鴨嘴獸", "刺蝟", "松鼠", "兔子", "倉鼠", "海獺", "海豹",
            "海豚", "鯨魚", "鯊魚", "章魚", "水母", "海馬", "烏龜", "鱷魚", "變色龍", "蛇",
            "青蛙", "蟾蜍", "蠑螈", "老鷹", "貓頭鷹", "鸚鵡", "蜂鳥", "孔雀", "天鵝", "火烈鳥",
            "蝴蝶", "蜜蜂", "蜻蜓", "螳螂", "螢火蟲", "蟬", "甲蟲", "螞蟻", "蜘蛛", "蠍子",
            "駱駝", "羊駝", "馴鹿", "羚羊", "犛牛", "水牛", "野豬", "馬", "驢子", "綿羊",
            "山羊", "乳牛", "貓", "狗", "狐獴", "土撥鼠", "金倉鼠", "天竺鼠", "龍貓", "臭鼬",
            "穿山甲", "食蟹獴", "石虎", "台灣黑熊", "梅花鹿", "藍鵲", "帝雉", "綠蠵龜", "櫻花鉤吻鮭", "曼波魚",
            "儒艮", "海牛", "信天翁", "鵜鶘", "鸕鶿", "黑面琵鷺", "啄木鳥", "翠鳥", "杜鵑", "燕子"
        ];

        let currentForceNumber = -1;
        const listContainer = document.getElementById('animal-list');
        const counterDisplay = document.getElementById('secret-counter');
        const sensitivity = 15; // 滑動 15 像素數字變動一次

        // 初始化列表
        function renderList(forceIndex = -1) {
            listContainer.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                let name = animalNames[(i - 1) % animalNames.length];
                
                // 強迫邏輯：如果當前數字是被選中的數字，顯示熊貓
                if (i === forceIndex) {
                    name = "熊貓 🐼";
                }

                const item = document.createElement('div');
                item.className = 'animal-item';
                item.innerHTML = `<span class="animal-num">${i}.</span> <span class="animal-name">${name}</span>`;
                listContainer.appendChild(item);
            }
        }

        renderList();

        // 觸控邏輯
        let startY = 0;
        let baseValue = 0;
        let activeCell = null;

        const grid = document.getElementById('grid');

        grid.addEventListener('touchstart', (e) => {
            const cell = e.target;
            if (cell.classList.contains('grid-cell')) {
                startY = e.touches[0].pageY;
                baseValue = parseInt(cell.dataset.range);
                activeCell = cell;
                updateCounter(baseValue);
            }
        }, { passive: false });

        grid.addEventListener('touchmove', (e) => {
            if (!activeCell) return;
            e.preventDefault(); // 防止頁面捲動

            const moveY = e.touches[0].pageY;
            const diff = moveY - startY;
            const step = Math.floor(diff / sensitivity);
            
            let finalNum = baseValue + step;
            
            // 限制在該格的範圍內 (例如 10-19)
            if (finalNum < baseValue) finalNum = baseValue;
            if (finalNum > baseValue + 9) finalNum = baseValue + 9;

            currentForceNumber = finalNum;
            updateCounter(finalNum);
        }, { passive: false });

        grid.addEventListener('touchend', () => {
            if (currentForceNumber !== -1) {
                renderList(currentForceNumber);
            }
            // 清除提示
            setTimeout(() => {
                counterDisplay.innerText = '';
            }, 500);
            activeCell = null;
        });

        function updateCounter(val) {
            counterDisplay.innerText = val;
        }
    </script>
</body>
</html>
