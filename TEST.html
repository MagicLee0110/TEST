<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔術輸入偵測</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 300px;
        }

        input {
            width: 100%;
            font-size: 24px;
            padding: 10px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            outline: none;
            /* 隱藏輸入框，如果魔術需要的話可以改為 opacity: 0 */
        }

        #display {
            font-size: 80px;
            font-weight: bold;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .red { color: #e74c3c; }
        .black { color: #2c3e50; }

        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <input type="text" id="magicInput" placeholder="請輸入3位數字" inputmode="numeric" maxlength="3" autocomplete="off">
    
    <div id="display">---</div>
    
    <div class="hint">範例：113 (黑桃K), 201 (紅心A)</div>
</div>

<script>
    const inputEl = document.getElementById('magicInput');
    const displayEl = document.getElementById('display');

    const suits = {
        '1': { icon: '♠', color: 'black' },
        '2': { icon: '♥', color: 'red' },
        '3': { icon: '♦', color: 'red' },
        '4': { icon: '♣', color: 'black' }
    };

    const ranks = {
        '01': 'A', '02': '2', '03': '3', '04': '4', '05': '5',
        '06': '6', '07': '7', '08': '8', '09': '9', '10': '10',
        '11': 'J', '12': 'Q', '13': 'K'
    };

    inputEl.addEventListener('input', (e) => {
        const val = e.target.value;

        if (val.length === 3) {
            const suitKey = val[0]; // 第1位
            const rankKey = val.substring(1); // 第2~3位

            const suit = suits[suitKey];
            const rank = ranks[rankKey];

            if (suit && rank) {
                displayEl.innerHTML = `${suit.icon}${rank}`;
                displayEl.className = suit.color;
            } else {
                displayEl.innerHTML = 'ERR';
                displayEl.className = 'black';
            }

            // 輸入完後自動清空（或保留，視魔術需求而定）
            // setTimeout(() => { e.target.value = ''; }, 1000);
        } else if (val.length === 0) {
            displayEl.innerHTML = '---';
            displayEl.className = 'black';
        }
    });

    // 點擊頁面任何地方自動聚焦輸入框 (方便盲打)
    document.body.addEventListener('click', () => {
        inputEl.focus();
    });
</script>

</body>
</html>
