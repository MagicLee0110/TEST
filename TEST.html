<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>iOS 26 Gallery</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --text-main: #FFFFFF;
            --text-sub: #8E8E93;
            --accent: #0A84FF;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header Area (Based on screenshot) --- */
        .header {
            padding-top: max(20px, var(--safe-top));
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            z-index: 100;
            position: fixed;
            top: 0; left: 0; right: 0;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .title {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
        }

        .header-right {
            display: flex;
            gap: 12px;
            margin-bottom: 5px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            background: #2C2C2E;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .select-btn {
            background: #2C2C2E;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        /* --- Grid Content --- */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-top: calc(80px + var(--safe-top)); /* Space for header */
            padding-bottom: 120px; /* Space for floating nav */
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
        }

        .photo {
            aspect-ratio: 1/1;
            background: #333;
            overflow: hidden;
            position: relative;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
        }

        /* --- Floating Bottom Nav (The "Island" Style) --- */
        .floating-dock {
            position: fixed;
            bottom: max(20px, var(--safe-bottom));
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            pointer-events: none; /* Let clicks pass through empty areas */
            z-index: 200;
        }

        /* Left Capsule */
        .nav-capsule {
            pointer-events: auto;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 35px;
            height: 65px;
            display: flex;
            align-items: center;
            padding: 0 5px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 100%;
            color: #888;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-icon {
            font-size: 24px;
            display: block;
        }
        
        .nav-label {
            font-size: 10px;
            font-weight: 600;
        }

        /* Right Search Circle */
        .search-circle {
            pointer-events: auto;
            width: 65px;
            height: 65px;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
        }

        /* --- Viewer Overlay --- */
        .viewer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 300;
            display: none;
            flex-direction: column;
            opacity: 0; transition: opacity 0.2s;
        }
        .viewer.show { opacity: 1; }
        
        .viewer-img-wrap {
            flex: 1; display: flex; align-items: center; justify-content: center;
        }
        .viewer img { max-width: 100%; max-height: 100%; }
        
        .viewer-close {
            position: absolute; top: max(20px, var(--safe-top)); left: 20px;
            padding: 10px; color: var(--accent); font-size: 18px; font-weight: 600;
            z-index: 301;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <div class="title">圖庫</div>
            <div class="subtitle">150 個項目</div>
        </div>
        <div class="header-right">
            <div class="icon-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </div>
            <div class="select-btn">選取</div>
        </div>
    </div>

    <div class="scroll-area">
        <div class="grid" id="grid">
            </div>
    </div>

    <div class="floating-dock">
        <div class="nav-capsule">
            <div class="nav-item active">
                <span class="nav-icon">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12z"/><path d="M8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                </span>
                <span class="nav-label">圖庫</span>
            </div>
            <div class="nav-item">
                <span class="nav-icon">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm2 4h12v2H6zm-2 4h16v2H4z"/></svg>
                </span>
                <span class="nav-label">選集</span>
            </div>
        </div>

        <div class="search-circle">
            <svg width="24" height="24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>
    </div>

    <div class="viewer" id="viewer" onclick="closeViewer()">
        <div class="viewer-close">完成</div>
        <div class="viewer-img-wrap">
            <img id="viewer-img" src="">
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const viewer = document.getElementById('viewer');
        const viewerImg = document.getElementById('viewer-img');

        // 30 Common Topics
        const topics = [
            "cat", "coffee", "sunset", "city", "gym", "food", 
            "book", "dog", "beach", "car", "watch", "friends",
            "rain", "party", "computer", "magic", "card", "bicycle",
            "mountain", "flower", "shoes", "concert", "baby", "art",
            "forest", "road", "sky", "snow", "smile", "bedroom"
        ];

        // Render Grid
        let html = '';
        topics.forEach((t, i) => {
            // Using a slightly different seed logic to ensure variety
            const src = `https://picsum.photos/seed/${t}_ios26_${i}/600/600`;
            html += `
                <div class="photo" onclick="openViewer('${src}')">
                    <img src="${src}" loading="lazy">
                </div>
            `;
        });
        grid.innerHTML = html;

        // Viewer Logic
        function openViewer(src) {
            viewerImg.src = src;
            viewer.style.display = 'flex';
            setTimeout(() => viewer.classList.add('show'), 10);
        }

        function closeViewer() {
            viewer.classList.remove('show');
            setTimeout(() => {
                viewer.style.display = 'none';
                viewerImg.src = '';
            }, 200);
        }
    </script>
</body>
</html>
