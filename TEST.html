<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>iOS Magic Professional</title>
    <style>
        :root {
            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            --main-gradient: linear-gradient(180deg, #000000 0%, #1a152e 40%, #000000 100%);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: var(--ios-font);
            overflow: hidden;
            background-color: #000;
        }

        /* --- 通知中心 --- */
        #notification-center {
            width: 100%; height: 100%;
            background: var(--main-gradient);
            background-attachment: fixed;
            position: relative;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .top-content { flex: 0 0 auto; z-index: 10; }

        .clock-container {
            text-align: center;
            padding-top: calc(env(safe-area-inset-top) + 60px);
            user-select: none;
            -webkit-user-select: none;
        }
        .time-text { font-size: 95px; font-weight: 200; margin: 0; letter-spacing: -2px; }
        .date-text { font-size: 19px; opacity: 0.9; }

        .notification-header { padding: 40px 25px 15px; font-size: 28px; font-weight: 600; }

        .notification-list { padding: 0 15px; }
        .notif-card {
            background: rgba(40, 40, 40, 0.4);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 24px; padding: 15px; margin-bottom: 12px;
            display: flex; flex-direction: column;
        }
        .notif-top { display: flex; gap: 12px; }
        .notif-icon { width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; position: relative; }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: white; color: black; font-size: 10px; font-weight: bold; padding: 2px 4px; border-radius: 10px; }
        .notif-content { flex: 1; }
        .notif-title-row { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; }
        .notif-time { font-weight: 400; opacity: 0.6; font-size: 13px; }
        .notif-body { font-size: 14px; line-height: 1.4; opacity: 0.9; }

        /* --- 隱形九宮格 (3x3) --- */
        .magic-area {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr); /* 改為三列 */
            z-index: 999;
            margin-bottom: 40px;
        }
        .magic-btn { width: 100%; height: 100%; background: transparent; }

        /* --- 備忘錄 --- */
        #memo-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #fff;
            display: none; flex-direction: column; z-index: 2000;
        }
        .memo-header { padding: calc(env(safe-area-inset-top) + 10px) 20px 10px; display: flex; justify-content: space-between; align-items: center; color: #d4a017; font-size: 17px; }
        .handwriting-area { flex: 1; display: flex; justify-content: center; align-items: center; font-family: "Cursive", "Bradley Hand", "Marker Felt", sans-serif; font-size: 200px; font-weight: bold; padding-bottom: 50px; }

        /* --- 後台設定畫面 --- */
        #backstage-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: white;
            display: none; flex-direction: column; z-index: 3000;
            padding: calc(env(safe-area-inset-top) + 20px) 20px;
            box-sizing: border-box; overflow-y: auto;
        }
        .backstage-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .grid-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px; }
        .grid-inputs input { background: #222; border: 1px solid #444; color: white; padding: 15px 5px; border-radius: 8px; text-align: center; font-size: 18px; width: 100%; box-sizing: border-box; }
        .save-btn { background: #d4a017; color: black; border: none; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold; width: 100%; }

        .home-bar { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; background: rgba(255, 255, 255, 0.4); border-radius: 10px; z-index: 4000; }
    </style>
</head>
<body>

    <div id="notification-center">
        <div class="top-content">
            <div class="clock-container" id="clockZone">
                <div class="date-text" id="dateDisplay">1月3日 週六</div>
                <h1 class="time-text" id="timeDisplay">15:02</h1>
            </div>
            <div class="notification-header">通知中心</div>
            <div class="notification-list">
                <div class="notif-card">
                    <div class="notif-top">
                        <div class="notif-icon" style="background-color: #ff4500;">S<span class="notif-badge">23</span></div>
                        <div class="notif-content">
                            <div class="notif-title-row"><span>您關注的賣家開始直播了！</span><span class="notif-time">1小時前</span></div>
                            <div class="notif-body">觀看 Yomigirls 的直播：神美浩肯包🤩...</div>
                        </div>
                    </div>
                </div>
                <div class="notif-card">
                    <div class="notif-top">
                        <div class="notif-icon" style="background-color: #006aa6;">D<span class="notif-badge">19</span></div>
                        <div class="notif-content">
                            <div class="notif-title-row"><span>你追蹤的「理財板」新文章</span><span class="notif-time">2小時前</span></div>
                            <div class="notif-body">「台股瘋了 正二也瘋了」</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="magic-area" id="magicGrid">
            <div class="magic-btn" onclick="triggerMagic(0)"></div>
            <div class="magic-btn" onclick="triggerMagic(1)"></div>
            <div class="magic-btn" onclick="triggerMagic(2)"></div>
            <div class="magic-btn" onclick="triggerMagic(3)"></div>
            <div class="magic-btn" onclick="triggerMagic(4)"></div>
            <div class="magic-btn" onclick="triggerMagic(5)"></div>
            <div class="magic-btn" onclick="triggerMagic(6)"></div>
            <div class="magic-btn" onclick="triggerMagic(7)"></div>
            <div class="magic-btn" onclick="triggerMagic(8)"></div>
        </div>
        <div class="home-bar"></div>
    </div>

    <div id="memo-screen" onclick="closeMemo()">
        <div class="memo-header"><span>＜ 備忘錄</span><span style="font-weight:600;">完成</span></div>
        <div class="handwriting-area" id="handwritingNumber"></div>
        <div class="home-bar"></div>
    </div>

    <div id="backstage-screen">
        <div class="backstage-title">九宮格內容設定</div>
        <div class="grid-inputs" id="inputContainer">
            </div>
        <button class="save-btn" onclick="saveSettings()">儲存並返回</button>
        <p style="color: #666; font-size: 14px; text-align: center; margin-top: 20px;">提示：點擊儲存後，長按通知中心時間可再次進入此畫面。</p>
    </div>

    <script>
        // 預設數字
        let magicValues = ["11", "22", "33", "44", "55", "66", "77", "88", "99"];
        
        // 初始化：讀取儲存的資料或生成輸入框
        const inputContainer = document.getElementById('inputContainer');
        const savedData = localStorage.getItem('magicNumbers');
        if (savedData) {
            magicValues = JSON.parse(savedData);
        }

        magicValues.forEach((val, index) => {
            const input = document.createElement('input');
            input.type = 'text';
            input.value = val;
            input.id = `input-${index}`;
            inputContainer.appendChild(input);
        });

        // 長按檢測
        let timer;
        const clockZone = document.getElementById('clockZone');
        
        clockZone.addEventListener('touchstart', () => {
            timer = setTimeout(() => {
                document.getElementById('backstage-screen').style.display = 'flex';
            }, 1500); // 長按 1.5 秒進入後台
        });

        clockZone.addEventListener('touchend', () => clearTimeout(timer));
        clockZone.addEventListener('mousedown', () => { // 支援電腦測試
            timer = setTimeout(() => {
                document.getElementById('backstage-screen').style.display = 'flex';
            }, 1500);
        });
        clockZone.addEventListener('mouseup', () => clearTimeout(timer));

        function saveSettings() {
            for (let i = 0; i < 9; i++) {
                magicValues[i] = document.getElementById(`input-${i}`).value;
            }
            localStorage.setItem('magicNumbers', JSON.stringify(magicValues));
            document.getElementById('backstage-screen').style.display = 'none';
        }

        function triggerMagic(index) {
            document.getElementById('handwritingNumber').textContent = magicValues[index];
            document.getElementById('notification-center').style.display = 'none';
            document.getElementById('memo-screen').style.display = 'flex';
        }

        function closeMemo() {
            document.getElementById('memo-screen').style.display = 'none';
            document.getElementById('notification-center').style.display = 'flex';
        }

        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hours}:${minutes}`;
            const weekDays = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
            document.getElementById('dateDisplay').textContent = `${now.getMonth() + 1}月${now.getDate()}日 ${weekDays[now.getDay()]} · 乙巳年冬月十五`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
