<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iOS Alarm Clone</title>
<style>
    /* --- iOS 基礎設定 --- */
    :root {
        --bg-color: #000000;
        --card-bg: #1C1C1E;
        --text-color: #FFFFFF;
        --sub-text: #8E8E93;
        --orange: #FF9F0A;
        --green: #30D158;
        --divider: #2C2C2E;
        --danger: #FF453A;
    }

    body {
        background-color: #111;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: var(--text-color);
        overflow: hidden;
    }

    /* 手機外框模擬 */
    .iphone-frame {
        width: 375px;
        height: 812px;
        background-color: var(--bg-color);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border-radius: 40px;
        box-shadow: 0 0 50px rgba(0,0,0,0.5);
        border: 8px solid #333;
    }

    /* --- 頂部狀態列 (模擬) --- */
    .status-bar {
        height: 44px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0 20px 10px;
        font-size: 14px;
        font-weight: 600;
        z-index: 10;
    }

    /* --- App Header --- */
    .app-header {
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .edit-btn {
        color: var(--orange);
        font-size: 17px;
        cursor: pointer;
    }

    .header-title {
        font-size: 30px;
        font-weight: bold;
    }

    .add-btn {
        color: var(--orange);
        font-size: 30px;
        font-weight: 300;
        cursor: pointer;
        line-height: 1;
    }

    /* --- 鬧鐘列表 --- */
    .alarm-list {
        flex: 1;
        overflow-y: auto;
        padding-top: 10px;
    }

    .alarm-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        border-bottom: 1px solid var(--divider);
        transition: background 0.2s;
    }

    .alarm-item:active {
        background-color: var(--card-bg);
    }

    .time-info {
        display: flex;
        flex-direction: column;
    }

    .time-display {
        font-size: 50px;
        font-weight: 300;
        line-height: 1;
        letter-spacing: -1px;
    }
    
    .time-display span {
        font-size: 30px; /* AM/PM */
        margin-left: 5px;
    }

    .alarm-label {
        font-size: 14px;
        color: var(--sub-text);
        margin-top: 5px;
    }

    /* 當鬧鐘關閉時，顏色變暗 */
    .alarm-item.inactive .time-display,
    .alarm-item.inactive .alarm-label {
        color: var(--sub-text);
    }

    /* --- iOS Toggle Switch --- */
    .switch {
        position: relative;
        display: inline-block;
        width: 51px;
        height: 31px;
    }

    .switch input { 
        opacity: 0;
        width: 0;
        height: 0;
    }

    .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #39393D;
        transition: .4s;
        border-radius: 34px;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 27px;
        width: 27px;
        left: 2px;
        bottom: 2px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
        box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }

    input:checked + .slider {
        background-color: var(--green);
    }

    input:checked + .slider:before {
        transform: translateX(20px);
    }

    /* --- 底部導航列 --- */
    .tab-bar {
        height: 83px;
        background-color: rgba(28, 28, 30, 0.95);
        border-top: 0.5px solid #38383A;
        display: flex;
        justify-content: space-around;
        align-items: flex-start;
        padding-top: 10px;
        backdrop-filter: blur(20px);
    }

    .tab-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: var(--sub-text);
        font-size: 10px;
        gap: 5px;
        cursor: pointer;
        width: 60px;
    }

    .tab-item.active {
        color: var(--orange);
    }

    .tab-icon {
        font-size: 24px;
    }

    /* --- 新增鬧鐘 Modal --- */
    .modal {
        position: absolute;
        top: 100%; /* 初始在下方 */
        left: 0;
        width: 100%;
        height: 92%; /* 留一點頭部 */
        background-color: #1C1C1E;
        border-top-left-radius: 15px;
        border-top-right-radius: 15px;
        transition: top 0.3s cubic-bezier(0.32, 0.72, 0, 1);
        z-index: 100;
        display: flex;
        flex-direction: column;
    }

    .modal.open {
        top: 8%;
    }

    .modal-header {
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        background-color: #2C2C2E;
        border-top-left-radius: 15px;
        border-top-right-radius: 15px;
    }

    .modal-btn {
        color: var(--orange);
        font-size: 16px;
        cursor: pointer;
    }

    .modal-title {
        font-weight: 600;
        font-size: 16px;
    }

    .modal-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 50px;
    }

    .time-picker {
        background: transparent;
        color: white;
        border: none;
        font-size: 50px;
        font-family: inherit;
        text-align: center;
        outline: none;
        background-color: #333;
        border-radius: 10px;
        padding: 10px;
    }
    
    /* 隱藏原生時間選擇器圖示 */
    input[type="time"]::-webkit-calendar-picker-indicator {
        filter: invert(1);
        cursor: pointer;
    }

</style>
</head>
<body>

<div class="iphone-frame">
    <div class="status-bar">
        <span id="clock-time">09:41</span>
        <div style="display:flex; gap:5px;">
            <span>📶</span>
            <span>🔋</span>
        </div>
    </div>

    <div class="app-header">
        <div class="edit-btn">編輯</div>
        <div class="header-title">鬧鐘</div>
        <div class="add-btn" onclick="openModal()">+</div>
    </div>

    <div class="alarm-list" id="alarmList">
        </div>

    <div class="tab-bar">
        <div class="tab-item">
            <span class="tab-icon">🌐</span>
            <span>世界時鐘</span>
        </div>
        <div class="tab-item active">
            <span class="tab-icon">⏰</span>
            <span>鬧鐘</span>
        </div>
        <div class="tab-item">
            <span class="tab-icon">⏱️</span>
            <span>碼表</span>
        </div>
        <div class="tab-item">
            <span class="tab-icon">⏲️</span>
            <span>計時器</span>
        </div>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-header">
            <div class="modal-btn" onclick="closeModal()">取消</div>
            <div class="modal-title">加入鬧鐘</div>
            <div class="modal-btn" style="font-weight:bold;" onclick="saveAlarm()">儲存</div>
        </div>
        <div class="modal-body">
            <input type="time" id="newAlarmTime" class="time-picker" value="08:00">
            <p style="color:#666; margin-top:20px;">選擇時間後點擊儲存</p>
        </div>
    </div>
</div>

<script>
    // 預設資料
    let alarms = [
        { id: 1, time: "06:30", note: "起床", active: true },
        { id: 2, time: "07:00", note: "鬧鐘", active: false },
        { id: 3, time: "08:15", note: "會議", active: true }
    ];

    const listContainer = document.getElementById('alarmList');
    const modal = document.getElementById('addModal');
    const clockElement = document.getElementById('clock-time');

    // 1. 渲染鬧鐘列表
    function renderAlarms() {
        listContainer.innerHTML = ''; // 清空
        
        // 排序：將時間轉為分鐘數進行比較
        alarms.sort((a, b) => {
            return parseInt(a.time.replace(':', '')) - parseInt(b.time.replace(':', ''));
        });

        alarms.forEach(alarm => {
            const item = document.createElement('div');
            item.className = `alarm-item ${alarm.active ? '' : 'inactive'}`;
            
            // 拆解時間算 AM/PM (簡單模擬)
            let [hour, min] = alarm.time.split(':');
            let displayHour = parseInt(hour);
            let period = ""; // 24小時制通常不顯示，但為了像iOS，這裡維持簡潔數字或可自行加入邏輯
            
            // 構建 HTML
            item.innerHTML = `
                <div class="time-info">
                    <div class="time-display">${hour}:${min}</div>
                    <div class="alarm-label">${alarm.note}</div>
                </div>
                <label class="switch">
                    <input type="checkbox" ${alarm.active ? 'checked' : ''} onchange="toggleAlarm(${alarm.id})">
                    <span class="slider"></span>
                </label>
            `;
            listContainer.appendChild(item);
        });
    }

    // 2. 切換開關邏輯
    window.toggleAlarm = function(id) {
        const alarm = alarms.find(a => a.id === id);
        if (alarm) {
            alarm.active = !alarm.active;
            renderAlarms(); // 重新渲染以更新文字顏色
        }
    }

    // 3. Modal 控制
    window.openModal = function() {
        modal.classList.add('open');
    }

    window.closeModal = function() {
        modal.classList.remove('open');
    }

    // 4. 儲存新鬧鐘
    window.saveAlarm = function() {
        const timeInput = document.getElementById('newAlarmTime').value;
        if (!timeInput) return;

        const newAlarm = {
            id: Date.now(), // 用時間戳當ID
            time: timeInput,
            note: "鬧鐘",
            active: true
        };

        alarms.push(newAlarm);
        renderAlarms();
        closeModal();
    }

    // 5. 更新狀態列時間
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        clockElement.textContent = `${h}:${m}`;
    }

    // 初始化
    renderAlarms();
    setInterval(updateClock, 1000);
    updateClock();

</script>

</body>
</html>
